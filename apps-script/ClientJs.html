<script>
  // The Cloudflare shell waits for this before hiding its "could not load"
  // fallback. A Google/Workspace error page never runs this script, so the
  // fallback can appear even when the iframe itself renders an error.
  try {
    if (window.top && window.top !== window) {
      window.top.postMessage({ type: 'polyclinic-ready' }, '*');
    }
  } catch (e) {}

  /** google.script.run as a promise. */
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
        reject(err && err.message ? err.message : err);
      });
      runner[fn].apply(runner, args);
    });
  }

  function el(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var _toastTimer = null;
  function toast(message) {
    var t = el('toast');
    if (!t) { alert(message); return; }
    t.textContent = message;
    t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3800);
  }

  function busy(button, isBusy, labelWhenBusy) {
    if (!button) return;
    if (isBusy) {
      button.dataset.label = button.textContent;
      button.textContent = labelWhenBusy || '…';
      button.disabled = true;
      button.classList.add('loading');
    } else {
      button.textContent = button.dataset.label || button.textContent;
      button.disabled = false;
      button.classList.remove('loading');
    }
  }

  /** Digits-only comparison so '0100 123 4567' and '01001234567' agree client-side. */
  function digits(s) { return String(s || '').replace(/\D/g, ''); }
</script>
