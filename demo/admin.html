<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<title>عرض تجريبي — إعدادات العيادة</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6f6c">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230f6f6c%22%2F%3E%3Cpath%20d%3D%22M32%2017v30M17%2032h30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  /* One brand colour (Settings → brand_primary) drives every shade below.
     Each pair: the fallback line first (older browsers), the color-mix line second. */
  :root {
    --primary-dark: var(--primary);
    --primary-dark: color-mix(in srgb, var(--primary), #000 18%);
    --primary-press: var(--primary);
    --primary-press: color-mix(in srgb, var(--primary), #000 26%);
    --tint: var(--soft);
    --tint: color-mix(in srgb, var(--primary) 8%, #fff);
    --tint-2: var(--soft);
    --tint-2: color-mix(in srgb, var(--primary) 15%, #fff);
    --ring: var(--soft);
    --ring: color-mix(in srgb, var(--primary) 25%, transparent);
    --sh-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --sh-md: 0 8px 20px rgba(16, 24, 40, .10);
    /* Three speeds, one ease curve: every animation shows progress, selection or success. */
    --t-fast: .15s;
    --t-med: .22s;
    --t-slow: .32s;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    /* Cairo is the Arabic-first face (clinics' patients read Arabic); the rest is the
       old stack so an offline phone still renders exactly like before. */
    font-family: "Cairo", "Segoe UI", Tahoma, system-ui, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  /* Phones fire a double-tap-to-zoom delay on every tappable thing; this removes it. */
  button, input, select, textarea, a { touch-action: manipulation; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
  header.top {
    background: linear-gradient(160deg, var(--primary), var(--primary-dark) 92%);
    color: #fff;
    padding: 22px 16px 24px;
    border-radius: 0 0 20px 20px;
  }
  header.top .inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  header.top img.logo { height: 48px; width: auto; border-radius: 12px; background: #fff; padding: 4px; }
  header.top h1 { font-size: 21px; margin: 0; font-weight: 800; line-height: 1.45; }
  header.top p { margin: 2px 0 0; font-size: 13.5px; opacity: .92; }

  /* Booking progress: «الخطوة 2 من 5» + five segments; the current one wears the ring. */
  .stepper { margin: 14px 2px 12px; }
  .stepper .lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; }
  .stepper .lbl b { color: var(--primary-dark); font-weight: 700; }
  .segs { display: flex; gap: 6px; }
  .segs i { flex: 1 1 0; height: 6px; border-radius: 99px; background: var(--line); transition: background var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease); }
  .segs i.on { background: var(--primary); }
  .segs i.now { box-shadow: 0 0 0 3.5px var(--ring); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 14px; box-shadow: var(--sh-sm);
  }
  .card h2 { font-size: 18px; margin: 0 0 4px; }
  .card .hint { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }

  /* Tap-first choice rows: big target, instant press feedback, unmistakable selection. */
  button.choice {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: right;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 13px 14px; min-height: 64px; margin-bottom: 9px;
    font-size: 15.5px; font-family: inherit; color: inherit; cursor: pointer;
    transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast) var(--ease);
  }
  button.choice:hover { border-color: var(--primary); }
  button.choice:active { transform: scale(.98); }
  button.choice.selected { border-color: var(--primary); border-width: 2px; padding: 12.5px 13.5px; background: var(--tint); }
  button.choice .mid { flex: 1 1 auto; min-width: 0; }
  button.choice .name { display: block; font-weight: 700; line-height: 1.5; }
  button.choice .sub { display: block; font-size: 13.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  button.choice .chip { display: inline-block; margin-top: 5px; font-size: 11.5px; font-weight: 700; color: var(--primary-dark); background: var(--tint-2); border-radius: 999px; padding: 2px 10px; }
  button.choice .avatar {
    width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto;
    background: var(--tint-2); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px;
  }
  button.choice .check {
    width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto;
    border: 1.5px solid var(--line); background: #fff; color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--t-fast), border-color var(--t-fast);
  }
  button.choice .check svg { width: 13px; height: 13px; opacity: 0; transition: opacity var(--t-fast); }
  button.choice.selected .check { background: var(--primary); border-color: var(--primary); }
  button.choice.selected .check svg { opacity: 1; }

  /* Buttons: pressed = shrink + darken; loading keeps a spinner inside the button. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 14px; padding: 13px 20px; min-height: 48px;
    font-size: 15.5px; font-family: inherit; font-weight: 700; cursor: pointer;
    background: var(--primary); color: #fff; text-decoration: none;
    transition: transform var(--t-fast) var(--ease), background var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast), opacity var(--t-fast);
  }
  .btn:active { transform: scale(.97); background: var(--primary-press); }
  .btn.wide { display: flex; width: 100%; }
  .btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--primary); background: var(--tint); }
  .btn.ghost:active { background: var(--tint-2); }
  .btn.danger { background: transparent; color: #b42318; border: 1.5px solid rgba(180, 35, 24, .3); }
  .btn.danger:hover { background: #feeceb; }
  .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn.loading { pointer-events: none; }
  .btn.loading::after {
    content: ""; width: 17px; height: 17px; border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, .35);
    border: 2.5px solid color-mix(in srgb, currentColor 32%, transparent);
    border-top-color: currentColor;
    animation: spin .7s linear infinite;
  }
  .btn.link { background: none; color: var(--primary); text-decoration: underline; padding: 8px 0; min-height: 44px; font-weight: 400; font-size: 14.5px; box-shadow: none; }
  .btn.link:active { transform: none; }

  .daybar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .daybar button {
    flex: 0 0 auto; scroll-snap-align: start; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 9px 14px; min-height: 56px; font-family: inherit; font-size: 13.5px; line-height: 1.35; cursor: pointer; text-align: center; color: inherit;
    transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast) var(--ease), box-shadow var(--t-med) var(--ease);
  }
  .daybar button:active { transform: scale(.95); }
  .daybar button.on { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 3px 8px color-mix(in srgb, var(--primary) 20%, transparent); }
  .daybar button .d { display: block; font-weight: 700; font-size: 14.5px; }
  .daybar button .sub { display: block; font-size: 12px; margin-top: 1px; opacity: .72; }
  .daybar button.on .sub { opacity: .9; }

  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .slots button {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 14px 6px; min-height: 50px; font-family: inherit; font-size: 15px; cursor: pointer; color: inherit;
    transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast) var(--ease), box-shadow var(--t-med) var(--ease), color var(--t-fast);
  }
  .slots button:hover { border-color: var(--primary); background: var(--tint); }
  .slots button:active { transform: scale(.95); }
  .slots button.on { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 6px 14px color-mix(in srgb, var(--primary) 28%, transparent); }
  /* A taken time should look impossible to pick (defence in depth; the server already filters). */
  .slots button:disabled { background: #f2f4f6; color: #98a2b3; border-color: #eef0f2; text-decoration: line-through; cursor: not-allowed; }

  label.field { display: block; margin-bottom: 14px; font-size: 14.5px; font-weight: 600; }
  label.field input, label.field textarea {
    display: block; width: 100%; margin-top: 6px; padding: 13px 14px; font-size: 16px;
    font-family: inherit; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--text);
    min-height: 50px;
    transition: border-color var(--t-fast), box-shadow var(--t-fast);
  }
  label.field input:focus, label.field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--ring); }
  label.field .why { font-weight: 400; font-size: 13px; color: var(--muted); display: block; margin-top: 4px; }
  .phone-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 400; background: var(--tint); padding: 12px; border-radius: 12px; }
  .consent input { width: 22px; height: 22px; margin-top: 1px; flex: 0 0 auto; }

  /* Honeypot: visually gone but still in the DOM for bots. No negative offsets —
     in an RTL page those would create thousands of pixels of empty scroll space. */
  .hp { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

  .msg { border-radius: 12px; padding: 12px 14px; font-size: 14.5px; margin-bottom: 12px; }
  .msg.err { background: #fdecea; color: #8a1c10; border: 1px solid #f5c2bb; }
  .msg.ok { background: #e8f5e9; color: #14532d; border: 1px solid #b7e0bb; }
  .msg.info { background: var(--tint); color: var(--text); border: 1px solid var(--line); }

  .summary { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 15px; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; font-weight: 600; }

  /* Booking reference: pill, so it reads as «the number to keep», not as body text. */
  .ref { font-family: ui-monospace, Consolas, monospace; direction: ltr; text-align: right; font-size: 13px; font-weight: 700; color: var(--primary-dark); background: var(--tint-2); border-radius: 999px; padding: 2px 11px; display: inline-block; }
  .spinner { text-align: center; padding: 28px; color: var(--muted); font-size: 14.5px; }
  .footer { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 22px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .actions .btn { flex: 1 1 auto; text-align: center; text-decoration: none; }
  /* The reception number for changing an appointment: the loudest thing on the
     confirmation card, because it is the one a patient actually needs. */
  .call-strip {
    flex: 2 1 230px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: var(--primary); color: #fff; text-decoration: none;
    border-radius: 14px; padding: 13px 16px; font-weight: 700; font-size: 15.5px;
    box-shadow: var(--sh-md);
  }
  .call-strip small { display: block; font-weight: 400; font-size: 12.5px; opacity: .92; margin-top: 3px; }
  .call-strip .num { direction: ltr; font-size: 19px; font-weight: 800; letter-spacing: .4px; white-space: nowrap; }

  /* The success moment: a drawn check. The one screen patients screenshot. */
  .done { text-align: center; padding: 8px 0 2px; }
  .done-check { margin: 0 auto 10px; width: 86px; height: 86px; border-radius: 50%; background: var(--tint); display: flex; align-items: center; justify-content: center; animation: pop var(--t-slow) var(--ease); }
  .done-check svg { width: 56px; height: 56px; }
  .done-check .r { fill: none; stroke: var(--tint-2); stroke-width: 2.5; stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw .6s var(--ease) forwards; }
  .done-check .k { fill: none; stroke: var(--primary); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 44; stroke-dashoffset: 44; animation: draw .45s var(--ease) .3s forwards; }
  .done h2 { font-size: 19px; margin: 0 0 4px; font-weight: 800; }
  .done .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 4px; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { from { transform: scale(.72); opacity: .4; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 50%;
    transform: translate(50%, 12px);
    background: #101828; color: #fff; padding: 12px 18px; border-radius: 12px;
    font-size: 14.5px; opacity: 0; pointer-events: none;
    transition: opacity var(--t-med) var(--ease), transform var(--t-med) var(--ease);
    z-index: 50; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: .96; transform: translate(50%, 0); }

  /* ----- Phones: thumb-first. Everything a step asks for gets a full-width target. ----- */
  @media (max-width: 560px) {
    .phone-row { grid-template-columns: 1fr; }
    .actions { flex-direction: column; }
    .actions .btn, .actions .call-strip { width: 100%; }
  }

  /* Some phones ask for less motion; honour it and show everything instantly. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
  }
</style>

  <style>
    :root {
      --primary: #0f6f6c;
      --soft: #f4f7f7;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #101828;
      --muted: #667085;
      --line: #e4e7ec;
    }
    header.top .inner { align-items: flex-start; }
    .hdr-actions { margin-inline-start: auto; display: flex; gap: 8px; }
    .hdr-btn {
      background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.28);
      border-radius: 10px; min-height: 40px; padding: 7px 13px; font-family: inherit;
      font-size: 13px; cursor: pointer;
    }
    .hdr-btn:active { background: rgba(255,255,255,.26); }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 8px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
    .tabs button {
      flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 999px; min-height: 38px; padding: 7px 14px; font-family: inherit; font-size: 13.5px;
      cursor: pointer; white-space: nowrap;
    }
    .tabs button.on { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }

    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-bottom: 14px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .stat b { display: block; font-size: 24px; line-height: 1.2; color: var(--primary-dark); }
    .stat span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }

    .entity {
      background: var(--card); border: 1px solid var(--line); border-radius: 15px;
      padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--sh-sm);
    }
    .ent-head { display: flex; gap: 10px; align-items: flex-start; }
    .ent-head > div:first-child { flex: 1 1 auto; min-width: 0; }
    .ent-head h3 { margin: 0; font-size: 16px; line-height: 1.5; }
    .ent-head .mini { margin: 3px 0 0; }
    .ent-head .badge { flex: 0 0 auto; margin-top: 2px; }
    .mini { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; background: var(--tint-2); color: var(--primary-dark); }
    .badge.off { background: #f2f4f6; color: #667085; }
    .badge.warn { background: #fff4d6; color: #8a5a00; }
    .row-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    .btn.mini-btn { min-height: 38px; padding: 7px 12px; font-size: 13px; border-radius: 10px; }
    .icon-btn { min-width: 38px; padding: 7px 9px; }
    .addbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .addbar .btn { flex: 1 1 180px; }
    .empty { text-align: center; color: var(--muted); padding: 20px 10px; font-size: 14px; }

    .group { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; background: var(--card); }
    .group.inactive { opacity: .72; }
    .group .head { display: flex; gap: 8px; align-items: flex-start; }
    .group .head > div { flex: 1 1 auto; }
    .group h3 { margin: 0; font-size: 15.5px; }
    .weeklist { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .weeklist span { background: var(--tint); color: var(--primary-dark); border-radius: 7px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
    .timebig { font-weight: 800; color: var(--primary-dark); direction: ltr; display: inline-block; }

    .field select {
      display: block; width: 100%; margin-top: 6px; padding: 12px 13px; font-size: 15px;
      font-family: inherit; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--text); min-height: 48px;
    }
    .field input[type="date"], .field input[type="time"], .field input[type="number"], .field input[type="color"] {
      display: block; width: 100%; margin-top: 6px; padding: 11px 12px; font-size: 15px;
      font-family: inherit; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--text); min-height: 48px;
    }
    .field input[type="color"] { padding: 4px; height: 48px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .check { display: flex; align-items: center; gap: 9px; font-size: 14px; margin: 4px 0 14px; }
    .check input { width: 20px; height: 20px; }
    .weekdays { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .weekdays button {
      border: 1.5px solid var(--line); background: #fff; color: var(--text); border-radius: 10px;
      min-height: 40px; padding: 7px 11px; font-family: inherit; font-size: 13px; cursor: pointer;
    }
    .weekdays button.on { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }

    .modal {
      position: fixed; inset: 0; background: rgba(16, 24, 40, .48); z-index: 60;
      display: none; overflow-y: auto; padding: 16px 12px calc(24px + env(safe-area-inset-bottom, 0px));
    }
    .modal.open { display: block; }
    .sheet {
      background: var(--card); border-radius: 18px; width: 100%; max-width: 620px;
      margin: 10px auto; padding: 17px; box-shadow: var(--sh-md); animation: sheetin var(--t-med) var(--ease);
    }
    @keyframes sheetin { from { transform: translateY(14px); opacity: .65; } }
    .sheet h2 { margin: 0 0 4px; font-size: 18px; }
    .sheet .hint { margin: 0 0 12px; }
    .sheet .actions { margin-top: 14px; }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
    .chips button {
      border: 1px solid var(--line); background: var(--tint); color: var(--primary-dark);
      border-radius: 999px; padding: 3px 9px; font-family: inherit; font-size: 11.5px; cursor: pointer; direction: ltr;
    }
    textarea { resize: vertical; }
    .preview {
      background: #eef7f5; border: 1px dashed #b9d9d2; border-radius: 11px; padding: 10px 12px;
      font-size: 13.5px; white-space: pre-wrap; line-height: 1.7; color: #174a43; margin: 8px 0;
    }
    .preview .unknown { color: #b42318; font-weight: 700; }

    .health { margin: 0; padding: 0; list-style: none; }
    .health li { border-radius: 10px; padding: 9px 11px; margin-bottom: 6px; font-size: 13px; line-height: 1.6; }
    .health li.warn { background: #fff8e6; color: #6b4a00; border: 1px solid #f2d48a; }
    .health li.info { background: var(--tint); color: var(--text); border: 1px solid var(--line); }

    .audit { padding: 0; margin: 0; list-style: none; }
    .audit li { border-bottom: 1px solid var(--line); padding: 10px 0; }
    .audit li:last-child { border-bottom: 0; }
    .audit b { font-size: 14px; }
    .audit .mini { margin: 2px 0 0; }
    .nowrap { white-space: nowrap; }

let _settingsCache = null;

function getSettings() {
  if (_settingsCache) return _settingsCache;
  const out = Object.assign({}, SETTING_DEFAULTS);
  try {
    Db.rows(SHEET.SETTINGS).forEach(function (r) {
      if (r.key) out[String(r.key)] = String(r.value);
    });
  } catch (err) {
    logWarn('getSettings', 'Settings sheet unreadable, using defaults: ' + err);
  }
  _settingsCache = out;
  return out;
}

function getSetting(key) {
  return getSettings()[key];
}

function setSetting(key, value) {
  const rows = Db.rows(SHEET.SETTINGS);
  const idx = rows.map(function (r) { return String(r.key); }).indexOf(String(key));
  if (idx >= 0) {
    Db.update(SHEET.SETTINGS, 'key', key, { value: value });
  } else {
    Db.append(SHEET.SETTINGS, {
      key: key,
      value: value,
      note: SETTING_NOTES[key] || ''
    });
  }
  _settingsCache = null;
}

function invalidateSettingsCache() {
  _settingsCache = null;
}

/**
 * Util.gs — dates, times, phone numbers, ids.
 *
 * Design rule: dates are 'yyyy-MM-dd' strings and times are 'HH:mm' strings,
 * everywhere. Times are compared as minutes-since-midnight. Date objects only
 * appear at the very edge (calendar events, "now").
 */

const AR_WEEKDAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

const AR_MONTHS = [
  'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
  'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
];

function pad2(n) {
  return (n < 10 ? '0' : '') + n;
}

function todayStr() {
  return formatDateStr(new Date());
}

/**
 * The clinic is due a full annual Excel export when the current year has not
 * been recorded yet. This is a reminder only; no booking data is ever deleted.
 */
function annualExportDue() {
  const last = Number(str(getSettings()[SETTING.ANNUAL_EXPORT_YEAR]));
  return !last || last < Number(todayStr().slice(0, 4));
}

function markAnnualExportDone() {
  const year = todayStr().slice(0, 4);
  setSetting(SETTING.ANNUAL_EXPORT_YEAR, year);
  return year;
}

function formatDateStr(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/** 'yyyy-MM-dd' -> Date at local midnight (never UTC, to avoid off-by-one days). */
function parseDateStr(s) {
  const parts = String(s).split('-');
  return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
}

function addDaysStr(dateStr, days) {
  const d = parseDateStr(dateStr);
  d.setDate(d.getDate() + days);
  return formatDateStr(d);
}

function daysBetweenStr(a, b) {
  const ms = parseDateStr(b).getTime() - parseDateStr(a).getTime();
  return Math.round(ms / 86400000);
}

/** 0 = Sunday … 6 = Saturday (Egyptian week). */
function weekdayIndex(dateStr) {
  return parseDateStr(dateStr).getDay();
}

function weekdayAr(dateStr) {
  return AR_WEEKDAYS[weekdayIndex(dateStr)];
}

/** '2026-10-18' -> 'الأحد 18 أكتوبر 2026' */
function formatDateAr(dateStr) {
  const d = parseDateStr(dateStr);
  return weekdayAr(dateStr) + ' ' + d.getDate() + ' ' + AR_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

/**
 * 'اليوم' / 'غداً' / 'بعد غد' for a date near today, otherwise the full Arabic date.
 *
 * The reminder is sent whenever the reception gets to it — the day before, or two days
 * before a holiday — so the message must not claim "tomorrow" by itself.
 */
function relativeDayAr(dateStr) {
  const days = daysBetweenStr(todayStr(), str(dateStr));
  if (days === 0) return 'اليوم';
  if (days === 1) return 'غداً';
  if (days === 2) return 'بعد غد';
  return formatDateAr(dateStr);
}

/** '14:30' -> 870. Tolerates '9:00', '09:00', '' and numbers. */
function parseTimeToMin(t) {
  if (t === null || t === undefined || t === '') return null;
  if (typeof t === 'number') return Math.round(t * 24 * 60); // Sheets time serial, if it ever happens
  const s = String(t).trim();
  if (!s) return null;
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return Number(m[1]) * 60 + Number(m[2]);
}

function minToTime(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return pad2(h) + ':' + pad2(m);
}

/** 900 -> '3:00 م' (12-hour, Arabic meridiem). */
function minToTimeAr(min) {
  const h24 = Math.floor(min / 60);
  const m = min % 60;
  const suffix = h24 < 12 ? 'ص' : 'م';
  let h = h24 % 12;
  if (h === 0) h = 12;
  return h + ':' + pad2(m) + ' ' + suffix;
}

function timeToAr(t) {
  const min = parseTimeToMin(t);
  return min === null ? String(t || '') : minToTimeAr(min);
}

function nowMinutes() {
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}

function overlaps(aStart, aEnd, bStart, bEnd) {
  return aStart < bEnd && bStart < aEnd;
}

/**
 * Normalize to a dialable international number, digits only with a leading '+'.
 * Keeps the raw value in the sheet too, so a bad rule is always recoverable.
 */
function normalizePhone(raw, countryCode) {
  const cc = String(countryCode || '+20').replace(/[^\d+]/g, '');
  const ccDigits = cc.replace(/\D/g, '');
  let s = String(raw || '').trim();
  // Arabic-Indic digits -> ASCII
  s = s.replace(/[\u0660-\u0669]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0x0660 + 48); });
  s = s.replace(/[\u06f0-\u06f9]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0x06f0 + 48); });
  const hadPlus = s.indexOf('+') === 0;
  let digits = s.replace(/\D/g, '');
  digits = digits.replace(/^00/, '');
  if (!digits) return '';
  if (digits.indexOf(ccDigits) === 0 && (hadPlus || digits.length > 9)) {
    return '+' + digits;
  }
  digits = digits.replace(/^0+/, '');
  return '+' + ccDigits + digits;
}

/** Loose validity check: enough digits to be a real mobile number. */
function isPlausiblePhone(raw, countryCode) {
  const n = normalizePhone(raw, countryCode);
  const digits = n.replace(/\D/g, '');
  return digits.length >= 9 && digits.length <= 15;
}

/** 'x' -> falsey-safe trimmed string. */
function str(v) {
  return v === null || v === undefined ? '' : String(v).trim();
}

/** Accepts an array or a comma-separated cell and returns clean, unique ids. */
function splitIds(value) {
  const raw = Object.prototype.toString.call(value) === '[object Array]'
    ? value
    : str(value).split(',');
  const out = [];
  raw.forEach(function (v) {
    const id = str(v);
    if (id && out.indexOf(id) === -1) out.push(id);
  });
  return out;
}

function reasonClinicIds(reason) {
  return splitIds(reason && reason.clinic_ids);
}

function reasonOwnedBy(reason, doctorId) {
  return !!reason && !!str(doctorId) && str(reason.doctor_id) === str(doctorId);
}

function reasonServesClinic(reason, clinicId) {
  return reasonClinicIds(reason).indexOf(str(clinicId)) !== -1;
}

function isTrue(v) {
  const s = String(v).trim().toLowerCase();
  return s === 'true' || s === 'yes' || s === '1' || s === 'نعم' || s === 'y';
}

function isFalseOrBlank(v) {
  const s = String(v).trim().toLowerCase();
  return s === '' || s === 'false' || s === 'no' || s === '0' || s === 'لا';
}

function newId(prefix) {
  const d = new Date();
  const stamp = formatDateStr(d).replace(/-/g, '') + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  const rnd = Math.random().toString(36).slice(2, 6).toUpperCase();
  return prefix + '-' + stamp + '-' + rnd;
}

function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/** Arabic-friendly CSV: BOM so Excel renders the text correctly. */
function csvFromRows(header, rows) {
  const esc = function (v) {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [header.map(esc).join(',')];
  rows.forEach(function (r) { lines.push(r.map(esc).join(',')); });
  return '\ufeff' + lines.join('\r\n');
}

/**
 * Stable ordering for config rows: explicit sort_order first, then the sheet's
 * existing row order. Blank sort_order is normal for rows created before the
 * admin page existed, so it must never jump to the top.
 */
function sortRowsByOrder(rows) {
  return rows.map(function (r, i) { return { r: r, i: i }; }).sort(function (a, b) {
    const ao = Number(a.r.sort_order);
    const bo = Number(b.r.sort_order);
    const av = ao > 0 ? ao : a.i + 1;
    const bv = bo > 0 ? bo : b.i + 1;
    return av - bv;
  }).map(function (x) { return x.r; });
}

function logInfo(context, message) {
  logLine('INFO', context, message);
}

function logWarn(context, message) {
  logLine('WARN', context, message);
}

function logError(context, message) {
  logLine('ERROR', context, message);
}

/** Doctor's colour as a hex value the browser can paint directly. */
function doctorColorHex(colorName) {
  return DOCTOR_COLOR_HEX[str(colorName).toLowerCase()] || '#0f6f6c';
}

/**
 * A phone number a patient can actually dial, or ''. Stops placeholder text like
 * '[هاتف الفرع]' from reaching the confirmation screen as a broken tel: link.
 */
function callablePhone(raw) {
  const s = str(raw);
  return s.replace(/\D/g, '').length >= 7 ? s : '';
}

function logLine(level, context, message) {
  try {
    Logger.log('[' + level + '] ' + context + ': ' + message);
    Db.append(SHEET.LOG, {
      timestamp: new Date().toISOString(),
      level: level,
      context: context,
      message: String(message).slice(0, 900)
    });
  } catch (err) {
    Logger.log('logLine failed: ' + err);
  }
}

/**
 * Db.gs — a very small object layer over the spreadsheet.
 *
 * Deliberately dumb: every read pulls the whole sheet. At polyclinic scale
 * (hundreds to low thousands of rows) this is faster and far simpler than
 * index bookkeeping, and it keeps the slot engine pure and testable.
 */

const Db = (function () {
  let _ss = null;

  function ss() {
    if (!_ss) {
      _ss = SpreadsheetApp.getActiveSpreadsheet();
      if (!_ss) throw new Error('No active spreadsheet. Bind the script to the clinic sheet.');
    }
    return _ss;
  }

  function sheet(name) {
    const sh = ss().getSheetByName(name);
    if (!sh) throw new Error('Missing sheet: ' + name + '. Run Setup.createAllSheets() first.');
    return sh;
  }

  function headers(name) {
    const sh = sheet(name);
    const width = Math.max(sh.getLastColumn(), 1);
    return sh.getRange(1, 1, 1, width).getValues()[0].map(function (h) { return String(h); });
  }

  /** All data rows of a sheet as plain objects keyed by header. Empty rows are skipped. */
  function rows(name) {
    const sh = sheet(name);
    const lastRow = sh.getLastRow();
    const hdr = headers(name);
    if (lastRow < 2) return [];
    const lastCol = Math.max(sh.getLastColumn(), hdr.length);
    const values = sh.getRange(2, 1, lastRow - 1, lastCol).getValues();
    const out = [];
    for (let i = 0; i < values.length; i++) {
      const raw = values[i];
      let blank = true;
      const obj = {};
      for (let c = 0; c < hdr.length; c++) {
        const v = raw[c];
        if (v !== '' && v !== null && v !== undefined) blank = false;
        obj[hdr[c]] = v === null || v === undefined ? '' : v;
      }
      if (!blank) {
        obj._row = i + 2; // 1-based physical row, handy for debugging
        out.push(obj);
      }
    }
    return out;
  }

  function findById(name, idField, idValue) {
    const hit = rows(name).filter(function (r) {
      return String(r[idField]) === String(idValue);
    });
    return hit.length ? hit[0] : null;
  }

  function append(name, obj) {
    const sh = sheet(name);
    const hdr = headers(name);
    const line = hdr.map(function (h) {
      const v = obj[h];
      return v === undefined || v === null ? '' : v;
    });
    sh.getRange(sh.getLastRow() + 1, 1, 1, hdr.length).setValues([line]);
    return line;
  }

  /** Patch one row, identified by a unique field. Returns true when a row was updated. */
  function update(name, idField, idValue, patch) {
    const sh = sheet(name);
    const hdr = headers(name);
    const all = rows(name);
    for (let i = 0; i < all.length; i++) {
      if (String(all[i][idField]) !== String(idValue)) continue;
      const line = hdr.map(function (h) {
        return Object.prototype.hasOwnProperty.call(patch, h)
          ? (patch[h] === undefined || patch[h] === null ? '' : patch[h])
          : (all[i][h] === undefined ? '' : all[i][h]);
      });
      sh.getRange(all[i]._row, 1, 1, hdr.length).setValues([line]);
      return true;
    }
    return false;
  }

  /** Append many rows at once (used by seeding and backups). */
  function appendMany(name, objects) {
    if (!objects || !objects.length) return 0;
    const sh = sheet(name);
    const hdr = headers(name);
    const block = objects.map(function (obj) {
      return hdr.map(function (h) {
        const v = obj[h];
        return v === undefined || v === null ? '' : v;
      });
    });
    sh.getRange(sh.getLastRow() + 1, 1, block.length, hdr.length).setValues(block);
    return block.length;
  }

  /**
   * Clear the rows whose idField is in idValues. The physical blank row stays,
   * which is harmless: rows() skips blanks, and it avoids shifting other rows.
   */
  function remove(name, idField, idValues) {
    const wanted = {};
    (Array.isArray(idValues) ? idValues : [idValues]).forEach(function (v) { wanted[String(v)] = true; });
    const sh = sheet(name);
    const hdr = headers(name);
    let removed = 0;
    rows(name).forEach(function (r) {
      if (!wanted[String(r[idField])]) return;
      sh.getRange(r._row, 1, 1, hdr.length).clearContent();
      removed++;
    });
    return removed;
  }

  /** Remove every row of a data sheet except the header (used only by seeding/backup tools). */
  function truncate(name) {
    const sh = sheet(name);
    const lastRow = sh.getLastRow();
    if (lastRow > 1) sh.getRange(2, 1, lastRow - 1, Math.max(sh.getLastColumn(), 1)).clearContent();
  }

  function reset() { _ss = null; }

  return {
    rows: rows,
    headers: headers,
    findById: findById,
    append: append,
    appendMany: appendMany,
    update: update,
    remove: remove,
    truncate: truncate,
    sheet: sheet,
    reset: reset
  };
})();
