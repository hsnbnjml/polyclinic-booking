        '<div id="annual-result"></div></div>';
    }
    html += healthCard();
    if (d.settings.bookingsPaused) {
      html += '<div class="msg err"><b>استقبال الحجوزات متوقف الآن.</b><br>' + esc(d.settings.pauseMessage || '') + '</div>';
    }
    html += '<div class="card"><h2>اختصارات</h2><div class="actions">';
    if (LINKS.booking) html += '<a class="btn ghost" href="' + esc(LINKS.booking) + '" target="_blank" rel="noopener">معاينة صفحة الحجز</a>';
    if (LINKS.staff) html += '<a class="btn ghost" href="' + esc(LINKS.staff) + '" target="_blank" rel="noopener">شاشة الاستقبال</a>';
    html += '<button class="btn ghost" onclick="setTab(\'schedule\')">تعديل الجدول</button>';
    html += '<button class="btn ghost" id="btn-backup" onclick="doBackup()">نسخة احتياطية الآن</button>';
    html += '</div></div>';
    html += '<div class="card"><h2>آخر التعديلات</h2>' + auditList(d.audit.slice(0, 5)) + '</div>';
    return html;
  }

  function stat(value, label) {
    return '<div class="stat"><b>' + Number(value || 0) + '</b><span>' + esc(label) + '</span></div>';
  }

  function healthCard() {
    var h = S.data.health || [];
    var html = '<div class="card"><h2>فحص سريع</h2><p class="hint">هذه الأشياء قد تمنع المرضى من الحجز أو تجعل البيانات ناقصة.</p>';
    if (!h.length) {
      html += '<div class="msg ok">كل الإعدادات الأساسية جاهزة.</div>';
    } else {
      html += '<ul class="health">';
      h.forEach(function (w) { html += '<li class="' + (w.level === 'info' ? 'info' : 'warn') + '">' + esc(w.text) + '</li>'; });
      html += '</ul>';
    }
    html += '</div>';
    return html;
  }

  function auditList(rows) {
    if (!rows || !rows.length) return '<div class="empty">لا توجد تعديلات مسجلة بعد.</div>';
    return '<ul class="audit">' + rows.map(function (r) {
      return '<li><b>' + esc(r.action) + '</b>' +
        '<p class="mini">' + esc(r.detail) + ' — ' + esc(r.actor) + ' — <span class="nowrap">' + esc(whenText(r.at)) + '</span></p></li>';
    }).join('') + '</ul>';
  }

  /* ------------------------------------------------------------------ *
   * Branches
   * ------------------------------------------------------------------ */

  function renderClinics() {
    var rows = S.data.clinics || [];
    var html = '<div class="card"><h2>الفروع</h2><p class="hint">الفرع هو أول سؤال يراه المريض. ترتيب الفروع هنا هو ترتيب ظهورها.</p>' +
      '<div class="addbar"><button class="btn" onclick="openClinic()">+ إضافة فرع</button></div>';
    if (!rows.length) {
      html += '<div class="empty">لا توجد فروع بعد. أضف أول فرع ليبدأ الحجز.</div></div>';
      return html;
    }
    rows.forEach(function (c, i) {
      html += '<div class="entity"><div class="ent-head"><div><h3>' + esc(c.nameAr) + '</h3>' +
        '<p class="mini">' + esc(c.addressAr || 'بدون عنوان') + '</p>' +
        '<p class="mini">' + (c.phone ? 'هاتف: <span dir="ltr">' + esc(c.phone) + '</span> · ' : '') + esc(c.hoursAr || '') + '</p></div>' +
        activeBadge(c.active) + '</div>' +
        '<div class="row-actions">' +
        '<button class="btn ghost mini-btn" onclick="openClinic(\'' + c.id + '\')">تعديل</button>' +
        '<button class="btn ghost mini-btn icon-btn" ' + (i === 0 ? 'disabled' : '') + ' onclick="moveEntity(\'clinics\',\'' + c.id + '\',-1)">↑</button>' +
        '<button class="btn ghost mini-btn icon-btn" ' + (i === rows.length - 1 ? 'disabled' : '') + ' onclick="moveEntity(\'clinics\',\'' + c.id + '\',1)">↓</button>' +
        '<button class="btn ghost mini-btn" onclick="toggleClinic(\'' + c.id + '\')">' + (c.active ? 'أرشفة' : 'تفعيل') + '</button>' +
        '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function openClinic(id) {
    var c = id ? byId(S.data.clinics, 'id', id) : { id: '', nameAr: '', addressAr: '', mapLink: '', phone: '', hoursAr: '', active: true };
    if (!c) return;
    openModal(
      '<h2>' + (id ? 'تعديل فرع' : 'إضافة فرع') + '</h2>' +
      '<p class="hint">هذه البيانات تظهر للمريض داخل صفحة الحجز.</p>' +
      '<label class="field">اسم الفرع *<input id="cl-name" value="' + esc(c.nameAr) + '" maxlength="120"></label>' +
      '<label class="field">العنوان<input id="cl-address" value="' + esc(c.addressAr) + '" maxlength="220"></label>' +
      '<label class="field">رابط الخريطة<input id="cl-map" value="' + esc(c.mapLink) + '" maxlength="500" dir="ltr"></label>' +
      '<label class="field">هاتف الفرع<input id="cl-phone" value="' + esc(c.phone) + '" maxlength="40" inputmode="tel" dir="ltr"></label>' +
      '<label class="field">ساعات العمل<input id="cl-hours" value="' + esc(c.hoursAr) + '" maxlength="160" placeholder="مثال: يومياً 9 ص – 9 م"></label>' +
      '<label class="check"><input id="cl-active" type="checkbox" ' + (c.active ? 'checked' : '') + '> نشط ويظهر للمرضى</label>' +
      '<div class="actions"><button class="btn" id="btn-save" onclick="saveClinic(\'' + esc(c.id) + '\')">حفظ</button>' +
      '<button class="btn ghost" onclick="closeModal()">إلغاء</button></div>'
    );
  }

  function saveClinic(id) {
    var payload = {
      id: id || '',
      nameAr: el('cl-name').value,
      addressAr: el('cl-address').value,
      mapLink: el('cl-map').value,
      phone: el('cl-phone').value,
      hoursAr: el('cl-hours').value,
      active: el('cl-active').checked
    };
    if (!String(payload.nameAr).trim()) { toast('اكتب اسم الفرع.'); return; }
    busy(el('btn-save'), true, 'جاري الحفظ…');
    api('adminSave', S.code, 'clinic', payload).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save'), false); toast(failText(res, 'تعذّر حفظ الفرع.')); return; }
      finishSave('تم حفظ الفرع.');
    }).catch(function (err) { busy(el('btn-save'), false); toast('خطأ: ' + err); });
  }

  function toggleClinic(id) {
    var c = byId(S.data.clinics, 'id', id);
    if (!c) return;
    var payload = { id: c.id, nameAr: c.nameAr, addressAr: c.addressAr, mapLink: c.mapLink, phone: c.phone, hoursAr: c.hoursAr, active: !c.active };
    busy(null, false);
    api('adminSave', S.code, 'clinic', payload).then(function (res) {
      if (!res || !res.ok) { toast(failText(res, 'تعذّر التحديث.')); return; }
      toast(c.active ? 'تمت أرشفة الفرع. لن يظهر للحجز الجديد.' : 'تم تفعيل الفرع.');
      loadData();
    }).catch(function (err) { toast('خطأ: ' + err); });
  }

  /* ------------------------------------------------------------------ *
   * Doctors
   * ------------------------------------------------------------------ */

  function renderDoctors() {
    var rows = S.data.doctors || [];
    var html = '<div class="card"><h2>الأطباء</h2><p class="hint">كل طبيب يمكن أن يعمل في أكثر من فرع. كود الحجز حرفان لاتينيان ويظهر في رقم الحجز.</p>' +
      '<div class="addbar"><button class="btn" onclick="openDoctor()">+ إضافة طبيب</button></div>';
    if (!rows.length) {
      html += '<div class="empty">لا يوجد أطباء بعد.</div></div>';
      return html;
    }
    rows.forEach(function (d, i) {
      var branches = (d.clinicIds || []).map(function (id) {
        var c = byId(S.data.clinics, 'id', id); return c ? c.nameAr : id;
      }).join('، ');
      html += '<div class="entity"><div class="ent-head"><div><h3>' + esc(d.nameAr) + '</h3>' +
        '<p class="mini">' + esc(d.specialtyAr) + (d.code ? ' · كود الحجز: <span dir="ltr">' + esc(d.code) + '</span>' : '') + '</p>' +
        '<p class="mini">' + esc(branches || 'بدون فروع') + (d.hasPin ? ' · له كود دخول' : ' · بدون كود دخول') + '</p></div>' +
        activeBadge(d.active) + '</div>' +
        '<div class="row-actions">' +
        '<button class="btn ghost mini-btn" onclick="openDoctor(\'' + d.id + '\')">تعديل</button>' +
        '<button class="btn ghost mini-btn" onclick="openDoctorPin(\'' + d.id + '\')">كود الدخول</button>' +
        '<button class="btn ghost mini-btn icon-btn" ' + (i === 0 ? 'disabled' : '') + ' onclick="moveEntity(\'doctors\',\'' + d.id + '\',-1)">↑</button>' +
        '<button class="btn ghost mini-btn icon-btn" ' + (i === rows.length - 1 ? 'disabled' : '') + ' onclick="moveEntity(\'doctors\',\'' + d.id + '\',1)">↓</button>' +
        '<button class="btn ghost mini-btn" onclick="toggleDoctor(\'' + d.id + '\')">' + (d.active ? 'أرشفة' : 'تفعيل') + '</button>' +
        '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function doctorBranchChecks(selected) {
    var html = '<div class="weekdays">';
    (S.data.clinics || []).forEach(function (c) {
      var on = (selected || []).indexOf(c.id) !== -1;
      html += '<button type="button" class="' + (on ? 'on' : '') + '" id="db-' + c.id + '" onclick="toggleBranch(\'' + c.id + '\',this)">' + esc(c.nameAr) + (c.active ? '' : ' (مؤرشف)') + '</button>';
    });
    html += '</div>';
    return html;
  }

  function openDoctor(id) {
    var d = id ? byId(S.data.doctors, 'id', id) : { id: '', nameAr: '', specialtyAr: '', code: '', clinicIds: [], color: 'teal', active: true };
    if (!d) return;
    S.editor = { clinicIds: (d.clinicIds || []).slice(), originalClinicIds: (d.clinicIds || []).slice() };
    var colorNames = { red: 'أحمر', orange: 'برتقالي', yellow: 'أصفر', green: 'أخضر', teal: 'تركوازي', blue: 'أزرق', purple: 'بنفسجي', gray: 'رمادي' };
    var colors = (S.data.meta.colors || []).map(function (c) {
      return '<option value="' + c + '" ' + (c === d.color ? 'selected' : '') + '>' + (colorNames[c] || c) + '</option>';
    }).join('');
    openModal(
      '<h2>' + (id ? 'تعديل طبيب' : 'إضافة طبيب') + '</h2>' +
      '<p class="hint">اختر الفروع التي يعمل بها. كود الحجز يُستخدم في رقم الحجز الذي يقرأه المريض. إزالة فرع تحذف أوقات الطبيب فيه وتزيله من أسباب الطبيب.</p>' +
      '<label class="field">اسم الطبيب *<input id="doc-name" value="' + esc(d.nameAr) + '" maxlength="120"></label>' +
      '<label class="field">التخصص *<input id="doc-specialty" value="' + esc(d.specialtyAr) + '" maxlength="160"></label>' +
      '<label class="field">كود الحجز (حرفان لاتينيان)<input id="doc-code" value="' + esc(d.code) + '" maxlength="2" dir="ltr" placeholder="اتركه فارغاً للتوليد"></label>' +
      '<label class="field">لون الطبيب في شاشة الاستقبال<select id="doc-color">' + colors + '</select></label>' +
      '<div class="field">الفروع *' + doctorBranchChecks(S.editor.clinicIds) + '</div>' +
      '<label class="check"><input id="doc-active" type="checkbox" ' + (d.active ? 'checked' : '') + '> نشط ويظهر للمرضى</label>' +
      '<div class="actions"><button class="btn" id="btn-save" onclick="saveDoctor(\'' + esc(d.id) + '\')">حفظ</button>' +
      '<button class="btn ghost" onclick="closeModal()">إلغاء</button></div>'
    );
  }

  function toggleBranch(id, btn) {
    var list = S.editor.clinicIds || [];
    var i = list.indexOf(id);
    if (i === -1) { list.push(id); btn.classList.add('on'); }
    else { list.splice(i, 1); btn.classList.remove('on'); }
    S.editor.clinicIds = list;
  }

  function saveDoctor(id) {
    var payload = {
      id: id || '',
      nameAr: el('doc-name').value,
      specialtyAr: el('doc-specialty').value,
      code: el('doc-code').value,
      color: el('doc-color').value,
      clinicIds: (S.editor && S.editor.clinicIds) || [],
      active: el('doc-active').checked
    };
    if (!String(payload.nameAr).trim()) { toast('اكتب اسم الطبيب.'); return; }
    if (!String(payload.specialtyAr).trim()) { toast('اكتب التخصص.'); return; }
    if (!payload.clinicIds.length) { toast('اختر فرعاً واحداً على الأقل.'); return; }
    var removed = ((S.editor && S.editor.originalClinicIds) || []).filter(function (c) {
      return payload.clinicIds.indexOf(c) === -1;
    });
    if (removed.length && !window.confirm('إزالة فرع من الطبيب ستحذف أوقاته في هذا الفرع وتزيله من أسباب الطبيب. هل تريد المتابعة؟')) return;
    busy(el('btn-save'), true, 'جاري الحفظ…');
    api('adminSave', S.code, 'doctor', payload).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save'), false); toast(failText(res, 'تعذّر حفظ الطبيب.')); return; }
      finishSave('تم حفظ الطبيب.');
    }).catch(function (err) { busy(el('btn-save'), false); toast('خطأ: ' + err); });
  }

  function toggleDoctor(id) {
    var d = byId(S.data.doctors, 'id', id);
    if (!d) return;
    api('adminSave', S.code, 'doctor', {
      id: d.id, nameAr: d.nameAr, specialtyAr: d.specialtyAr, code: d.code,
      color: d.color, clinicIds: d.clinicIds, active: !d.active
    }).then(function (res) {
      if (!res || !res.ok) { toast(failText(res, 'تعذّر التحديث.')); return; }
      toast(d.active ? 'تمت أرشفة الطبيب. الحجوزات القديمة تبقى.' : 'تم تفعيل الطبيب.');
      loadData();
    }).catch(function (err) { toast('خطأ: ' + err); });
  }

  function openDoctorPin(id) {
    var d = byId(S.data.doctors, 'id', id);
    if (!d) return;
    openModal(
      '<h2>كود دخول ' + esc(d.nameAr) + '</h2>' +
      '<p class="hint">كود من 4 إلى 8 أرقام. يستطيع الطبيب الدخول به إلى صفحة الإعدادات وتعديل جدوله فقط. لا يمكن عرض الكود بعد الحفظ.</p>' +
      '<label class="field">كود الطبيب<input id="pin-value" type="text" inputmode="numeric" autocomplete="off" maxlength="8" dir="ltr" placeholder="مثال: 123456"></label>' +
      '<div class="actions"><button class="btn" id="btn-save" onclick="saveDoctorPin(\'' + d.id + '\')">حفظ الكود</button>' +
      '<button class="btn ghost" onclick="fillRandomPin()">توليد كود</button></div>' +
      (d.hasPin ? '<div class="actions"><button class="btn danger wide" onclick="clearDoctorPin(\'' + d.id + '\')">إيقاف دخول هذا الطبيب</button></div>' : '') +
      '<div class="actions"><button class="btn ghost wide" onclick="closeModal()">إلغاء</button></div>'
    );
  }

  function fillRandomPin() {
    var n = '';
    for (var i = 0; i < 6; i++) n += Math.floor(Math.random() * 10);
    el('pin-value').value = n;
    el('pin-value').focus();
  }

  function saveDoctorPin(id) {
    var pin = (el('pin-value').value || '').trim();
    if (!pin) { toast('اكتب كود الطبيب أو استخدم زر التوليد.'); return; }
    busy(el('btn-save'), true, 'جاري الحفظ…');
    api('adminSetDoctorPin', S.code, id, pin).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save'), false); toast(failText(res, 'تعذّر حفظ الكود.')); return; }
      finishSave('تم حفظ كود الطبيب. أعطه للطبيب الآن.');
    }).catch(function (err) { busy(el('btn-save'), false); toast('خطأ: ' + err); });
  }

  function clearDoctorPin(id) {
    if (!window.confirm('إيقاف دخول هذا الطبيب إلى صفحة الإعدادات؟')) return;
    api('adminSetDoctorPin', S.code, id, '').then(function (res) {
      if (!res || !res.ok) { toast(failText(res, 'تعذّر الإيقاف.')); return; }
      finishSave('تم إيقاف دخول الطبيب.');
    }).catch(function (err) { toast('خطأ: ' + err); });
  }

  /* ------------------------------------------------------------------ *
   * Visit reasons
   * ------------------------------------------------------------------ */

  function reasonDoctorBranches(doctorId) {
    if (S.role === 'doctor') return S.data.branches || [];
    var d = doctorObj(doctorId);
    if (!d) return [];
    return (S.data.clinics || []).filter(function (c) {
      return (d.clinicIds || []).indexOf(c.id) !== -1;
    });
  }

  function reasonBranchesText(r) {
    var names = (r.clinicIds || []).map(function (id) { return clinicName(id); });
    return names.length ? names.join('، ') : 'بدون فروع';
  }

  function reasonBranchChecksHtml(doctorId, selected) {
    var branches = reasonDoctorBranches(doctorId);
    if (!branches.length) {
      return '<div class="msg info">لا توجد فروع مرتبطة بهذا الطبيب. أضف فرعاً للطبيب من قسم الأطباء أولاً.</div>';
    }
    return '<div class="weekdays">' + branches.map(function (c) {
      var on = (selected || []).indexOf(c.id) !== -1;
      return '<button type="button" class="' + (on ? 'on' : '') + '" onclick="toggleReasonBranch(\'' + esc(c.id) + '\',this)">' +
        esc(c.nameAr) + (c.active ? '' : ' (مؤرشف)') + '</button>';
    }).join('') + '</div>';
  }

  function setReasonFilter(value) {
    S.reasonDoctorFilter = value || '';
    render();
  }

  function renderReasons() {
    var isDoctor = S.role === 'doctor';
    var all = S.data.reasons || [];
    var rows = all;
    if (!isDoctor && S.reasonDoctorFilter) {
      rows = all.filter(function (r) { return r.doctorId === S.reasonDoctorFilter; });
    }
    var html = '<div class="card"><h2>' + (isDoctor ? 'أسبابي' : 'أسباب الزيارة') + '</h2>' +
      '<p class="hint">' + (isDoctor
        ? 'هذه أسبابك وحدك. عند إضافتها تصبح جاهزة، وتظهر للمرضى بعد إضافة وقت لها في «مواعيدي». أرشفة السبب تحذف أوقاته من جدولك.'
        : 'كل سبب يخص طبيباً واحداً ويمكن تقديمه في فرع أو أكثر من فروعه. «نسخ» ينشئ نسخة مستقلة لطبيب آخر؛ تعديل نسخة لا يغيّر الأصل.') + '</p>';

    if (!isDoctor) {
      var docOptions = '<option value="">كل الأطباء</option>' + (S.data.doctors || []).map(function (d) {
        return '<option value="' + d.id + '" ' + (d.id === S.reasonDoctorFilter ? 'selected' : '') + '>' +
          esc(d.nameAr) + (d.active ? '' : ' (مؤرشف)') + '</option>';
      }).join('');
      html += '<label class="field">عرض أسباب طبيب<select id="rs-filter" onchange="setReasonFilter(this.value)">' + docOptions + '</select></label>';
    }

    html += '<div class="addbar"><button class="btn" onclick="openReason()">+ إضافة سبب زيارة</button></div>';
    if (!rows.length) {
      html += '<div class="empty">' + (S.reasonDoctorFilter ? 'لا توجد أسباب لهذا الطبيب بعد.' : 'لا توجد أسباب زيارة بعد.') + '</div></div>';
      return html;
    }

    rows.forEach(function (r) {
      var i = all.indexOf(r);
      var meta = [];
      if (!isDoctor) meta.push('الطبيب: ' + doctorName(r.doctorId));
      meta.push('الفروع: ' + reasonBranchesText(r));
      html += '<div class="entity"><div class="ent-head"><div><h3>' + esc(r.nameAr) + '</h3>' +
        '<p class="mini">' + esc(meta.join(' · ')) + '</p>' +
        '<p class="mini">' + Number(r.durationMin) + ' دقيقة · مهلة ' + Number(r.leadHours) + ' ساعة · حتى ' + Number(r.bookDaysAhead) + ' يوماً مقدماً' +
        (r.maxPerDay ? ' · ' + Number(r.maxPerDay) + ' يومياً' : ' · بلا حد يومي') + '</p>' +
        (r.descriptionAr ? '<p class="mini">' + esc(r.descriptionAr) + '</p>' : '') + '</div>' + activeBadge(r.active) + '</div>' +
        '<div class="row-actions">' +
        '<button class="btn ghost mini-btn" onclick="openReason(\'' + r.id + '\')">تعديل</button>' +
        (!isDoctor ? '<button class="btn ghost mini-btn" onclick="openCopyReason(\'' + r.id + '\')">نسخ</button>' : '') +
        (!isDoctor && !S.reasonDoctorFilter
          ? '<button class="btn ghost mini-btn icon-btn" ' + (i === 0 ? 'disabled' : '') + ' onclick="moveEntity(\'reasons\',\'' + r.id + '\',-1)">↑</button>' +
            '<button class="btn ghost mini-btn icon-btn" ' + (i === all.length - 1 ? 'disabled' : '') + ' onclick="moveEntity(\'reasons\',\'' + r.id + '\',1)">↓</button>'
          : '') +
        '<button class="btn ghost mini-btn" onclick="toggleReason(\'' + r.id + '\')">' + (r.active ? 'أرشفة' : 'تفعيل') + '</button>' +
        '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function openReason(id) {
    var isDoctor = S.role === 'doctor';
    var r = id ? byId(S.data.reasons, 'id', id) : {
      id: '', nameAr: '', descriptionAr: '', durationMin: 30, leadHours: 4,
      bookDaysAhead: 14, maxPerDay: 0, active: true, doctorId: '', clinicIds: []
    };
    if (!r) return;

    var defaultDoctor = isDoctor ? S.data.doctor.id :
      (S.reasonDoctorFilter || ((S.data.doctors || []).filter(function (d) { return d.active; })[0] || {}).id || '');
    var doctorId = id ? (r.doctorId || defaultDoctor) : defaultDoctor;
    if (!doctorId) { toast('أضف طبيباً أولاً.'); return; }
    S.editor = {
      reasonId: id || '',
      doctorId: doctorId,
      clinicIds: (r.clinicIds || []).slice(),
      originalClinicIds: (r.clinicIds || []).slice(),
      originalActive: !!r.active
    };

    var doctorField = '';
    if (isDoctor) {
      doctorField = '<div class="msg info">الطبيب: <b>' + esc(S.data.doctor.nameAr) + '</b></div>';
    } else {
      var doctorOptions = (S.data.doctors || []).map(function (d) {
        return '<option value="' + d.id + '" ' + (d.id === doctorId ? 'selected' : '') + '>' +
          esc(d.nameAr) + (d.active ? '' : ' (مؤرشف)') + '</option>';
      }).join('');
      doctorField = '<label class="field">الطبيب *' +
        '<select id="rs-doctor" ' + (id ? 'disabled' : '') + ' onchange="changeReasonDoctor(this.value)">' + doctorOptions + '</select>' +
        (id ? '<span class="mini">لا يمكن نقل السبب لطبيب آخر. استخدم «نسخ».</span>' : '') + '</label>';
    }

    openModal(
      '<h2>' + (id ? 'تعديل سبب زيارة' : 'إضافة سبب زيارة') + '</h2>' +
      '<p class="hint">' + (isDoctor
        ? 'السبب يخصك وحدك. اختر الفروع التي تقدمه فيها، ثم أضف له وقتاً من تبويب «مواعيدي». إزالة فرع تحذف أوقاته في ذلك الفرع، والأرشفة تحذف كل أوقاته.'
        : 'اختر الطبيب والفروع. كل نسخة سبب مستقلة؛ عند نسخها لطبيب آخر لا تتأثر هذه النسخة. إزالة فرع تحذف أوقات السبب في ذلك الفرع، والأرشفة تحذف كل أوقاته.') + '</p>' +
      doctorField +
      '<div class="field">الفروع *<div id="rs-branches">' + reasonBranchChecksHtml(doctorId, S.editor.clinicIds) + '</div></div>' +
      '<label class="field">الاسم *<input id="rs-name" value="' + esc(r.nameAr) + '" maxlength="120"></label>' +
      '<label class="field">وصف مختصر<input id="rs-desc" value="' + esc(r.descriptionAr) + '" maxlength="220"></label>' +
      '<div class="two"><label class="field">مدة الموعد (دقيقة)<input id="rs-duration" type="number" min="5" max="240" value="' + Number(r.durationMin) + '"></label>' +
      '<label class="field">أقل مهلة قبل الموعد (ساعات)<input id="rs-lead" type="number" min="0" max="168" value="' + Number(r.leadHours) + '"></label></div>' +
      '<div class="two"><label class="field">الحجز حتى كم يوماً مقدماً<input id="rs-days" type="number" min="1" max="90" value="' + Number(r.bookDaysAhead) + '"></label>' +
      '<label class="field">حد الحجز اليومي (0 = بلا حد)<input id="rs-max" type="number" min="0" max="100" value="' + Number(r.maxPerDay) + '"></label></div>' +
      '<label class="check"><input id="rs-active" type="checkbox" ' + (r.active ? 'checked' : '') + '> نشط ويظهر للمرضى</label>' +
      '<div class="actions"><button class="btn" id="btn-save" onclick="saveReason(\'' + esc(r.id) + '\')">حفظ</button>' +
      '<button class="btn ghost" onclick="closeModal()">إلغاء</button></div>'
    );
  }

  function changeReasonDoctor(doctorId) {
    if (!S.editor || S.editor.reasonId) return;
    S.editor.doctorId = doctorId;
    var allowed = reasonDoctorBranches(doctorId).map(function (c) { return c.id; });
    S.editor.clinicIds = (S.editor.clinicIds || []).filter(function (c) { return allowed.indexOf(c) !== -1; });
    var box = el('rs-branches');
    if (box) box.innerHTML = reasonBranchChecksHtml(doctorId, S.editor.clinicIds);
  }

  function toggleReasonBranch(id, btn) {
    if (!S.editor) return;
    var list = S.editor.clinicIds || [];
    var i = list.indexOf(id);
    if (i === -1) { list.push(id); btn.classList.add('on'); }
    else { list.splice(i, 1); btn.classList.remove('on'); }
    S.editor.clinicIds = list;
  }

  function saveReason(id) {
    if (!S.editor) return;
    var payload = {
      id: id || '',
      doctorId: S.editor.doctorId,
      clinicIds: S.editor.clinicIds || [],
      nameAr: el('rs-name').value,
      descriptionAr: el('rs-desc').value,
      durationMin: el('rs-duration').value,
      leadHours: el('rs-lead').value,
      bookDaysAhead: el('rs-days').value,
      maxPerDay: el('rs-max').value,
      active: el('rs-active').checked
    };
    if (!String(payload.nameAr).trim()) { toast('اكتب اسم سبب الزيارة.'); return; }
    if (payload.active && !payload.clinicIds.length) { toast('اختر فرعاً واحداً على الأقل ليظهر السبب للمرضى.'); return; }
    if (id) {
      var removed = ((S.editor.originalClinicIds) || []).filter(function (c) {
        return payload.clinicIds.indexOf(c) === -1;
      });
      var warnings = [];
      if (removed.length) {
        warnings.push('ستُحذف أوقات هذا السبب في: ' + removed.map(function (c) { return clinicName(c); }).join('، ') + '.');
      }
      if (S.editor.originalActive && !payload.active) {
        warnings.push('الأرشفة ستخفي السبب وتُحذف كل أوقاته من الجدول.');
      }
      if (warnings.length && !window.confirm(warnings.join('\n') + '\nهل تريد المتابعة؟')) return;
    }
    busy(el('btn-save'), true, 'جاري الحفظ…');
    api('adminSave', S.code, 'reason', payload).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save'), false); toast(failText(res, 'تعذّر حفظ سبب الزيارة.')); return; }
      finishSave('تم حفظ سبب الزيارة.');
    }).catch(function (err) { busy(el('btn-save'), false); toast('خطأ: ' + err); });
  }

  function toggleReason(id) {
    var r = byId(S.data.reasons, 'id', id);
    if (!r) return;
    if (r.active && !window.confirm('أرشفة سبب «' + r.nameAr + '»؟ سيختفي من الحجز، وستُحذف كل أوقاته من الجدول. الحجوزات القديمة تبقى في السجل.')) return;
    if (!r.active && !(r.clinicIds || []).length) {
      toast('هذا السبب بلا فروع. عدّله واختر فرعاً واحداً على الأقل ثم فعّله.');
      return;
    }
    api('adminSave', S.code, 'reason', {
      id: r.id, doctorId: r.doctorId, clinicIds: r.clinicIds,
      nameAr: r.nameAr, descriptionAr: r.descriptionAr,
      durationMin: r.durationMin, leadHours: r.leadHours,
      bookDaysAhead: r.bookDaysAhead, maxPerDay: r.maxPerDay, active: !r.active
    }).then(function (res) {
      if (!res || !res.ok) { toast(failText(res, 'تعذّر التحديث.')); return; }
      toast(r.active ? 'تمت أرشفة سبب الزيارة وحذف أوقاته.' : 'تم تفعيل سبب الزيارة. أضف وقتاً له ليظهر للمرضى.');
      loadData();
    }).catch(function (err) { toast('خطأ: ' + err); });
  }

  /* ------------------------------------------------------------------ *
   * Copy a reason to other doctors (admin only)
   * ------------------------------------------------------------------ */

  function copyDefaultBranches(source, target) {
    return (source.clinicIds || []).filter(function (c) {
      return (target.clinicIds || []).indexOf(c) !== -1;
    });
  }

  function openCopyReason(id) {
    if (S.role !== 'admin') return;
    var source = reasonObj(id);
    if (!source) return;
    var targets = (S.data.doctors || []).filter(function (d) {
      return d.active && d.id !== source.doctorId;
    });
    if (!targets.length) { toast('لا يوجد طبيب آخر نشط تنسخ إليه.'); return; }
    S.editor = { copySourceId: source.id, copyTargets: {}, copyBranches: {} };

    var html = '<h2>نسخ «' + esc(source.nameAr) + '»</h2>' +
      '<p class="hint">كل طبيب مختار يحصل على نسخة مستقلة. اختر لكل طبيب الفروع التي سيقدم السبب فيها؛ لا تُنسخ أوقات الجدول.</p>';
    targets.forEach(function (d) {
      html += '<div class="group" style="padding:10px;margin-bottom:10px">' +
        '<label class="check"><input id="cp-doc-' + d.id + '" type="checkbox" onchange="toggleCopyTarget(\'' + d.id + '\',this.checked)"> ' +
        esc(d.nameAr) + ' <span class="mini">(' + esc((d.clinicIds || []).map(function (c) { return clinicName(c); }).join('، ') || 'بدون فروع') + ')</span></label>' +
        '<div id="cp-wrap-' + d.id + '" style="display:none;margin-top:8px">' +
        '<div id="cp-branches-' + d.id + '"></div></div></div>';
    });
    html += '<div class="actions"><button class="btn" id="btn-save" onclick="saveCopyReason()">نسخ إلى المحددين</button>' +
      '<button class="btn ghost" onclick="closeModal()">إلغاء</button></div>';
    openModal(html);
  }

  function copyBranchChecksHtml(doctorId, selected) {
    return '<div class="weekdays">' + reasonDoctorBranches(doctorId).map(function (c) {
      var on = (selected || []).indexOf(c.id) !== -1;
      return '<button type="button" class="' + (on ? 'on' : '') + '" onclick="toggleCopyBranch(\'' + doctorId + '\',\'' + c.id + '\',this)">' +
        esc(c.nameAr) + (c.active ? '' : ' (مؤرشف)') + '</button>';
    }).join('') + '</div>' +
      (reasonDoctorBranches(doctorId).length ? '<span class="mini">اختر فرعاً واحداً على الأقل.</span>' : '<div class="msg info">هذا الطبيب بلا فروع.</div>');
  }

  function toggleCopyTarget(doctorId, checked) {
    if (!S.editor) return;
    var wrap = el('cp-wrap-' + doctorId);
    if (!checked) {
      delete S.editor.copyTargets[doctorId];
      delete S.editor.copyBranches[doctorId];
      if (wrap) wrap.style.display = 'none';
      return;
    }
    var source = reasonObj(S.editor.copySourceId);
    var target = doctorObj(doctorId);
    var shared = source && target ? copyDefaultBranches(source, target) : [];
    S.editor.copyTargets[doctorId] = true;
    S.editor.copyBranches[doctorId] = shared.slice();
    if (wrap) {
      wrap.style.display = '';
      var box = el('cp-branches-' + doctorId);
      if (box) box.innerHTML = copyBranchChecksHtml(doctorId, shared);
    }
  }

  function toggleCopyBranch(doctorId, clinicId, btn) {
    if (!S.editor) return;
    var list = S.editor.copyBranches[doctorId] || [];
    var i = list.indexOf(clinicId);
    if (i === -1) { list.push(clinicId); btn.classList.add('on'); }
    else { list.splice(i, 1); btn.classList.remove('on'); }
    S.editor.copyBranches[doctorId] = list;
    S.editor.copyTargets[doctorId] = true;
  }

  function saveCopyReason() {
    if (!S.editor) return;
    var targets = Object.keys(S.editor.copyTargets || {}).map(function (doctorId) {
      return { doctorId: doctorId, clinicIds: (S.editor.copyBranches[doctorId] || []).slice() };
    });
    if (!targets.length) { toast('اختر طبيباً واحداً على الأقل.'); return; }
    for (var i = 0; i < targets.length; i++) {
      if (!targets[i].clinicIds.length) { toast('اختر فرعاً واحداً على الأقل لكل طبيب محدد.'); return; }
    }
    busy(el('btn-save'), true, 'جاري النسخ…');
    api('adminCopyReason', S.code, S.editor.copySourceId, targets).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save'), false); toast(failText(res, 'تعذّر نسخ سبب الزيارة.')); return; }
      finishSave('تم إنشاء ' + ((res.copies || []).length) + ' نسخة مستقلة. أضف أوقاتاً لها من الجدول.');
    }).catch(function (err) { busy(el('btn-save'), false); toast('خطأ: ' + err); });
  }

  /* ------------------------------------------------------------------ *
   * Weekly schedule
   * ------------------------------------------------------------------ */

  function ensureScheduleSelection() {
    if (!S.data) return;
    if (S.role === 'doctor') {
      var branches = S.data.branches || [];
      if (!S.clinicId || !find(branches, S.clinicId)) S.clinicId = branches.length ? branches[0].id : '';
      return;
    }
    var docs = (S.data.doctors || []).filter(function (d) { return d.active; });
    if (!S.doctorId || !find(docs, S.doctorId)) S.doctorId = docs.length ? docs[0].id : '';
    var bs = branchesFor(S.doctorId);
    if (!S.clinicId || !find(bs, S.clinicId)) S.clinicId = bs.length ? bs[0].id : '';
  }

  function branchesFor(doctorId) {
    if (S.role === 'doctor') return S.data.branches || [];
    var d = doctorObj(doctorId);
    if (!d) return [];
    return (S.data.clinics || []).filter(function (c) {
      return c.active && (d.clinicIds || []).indexOf(c.id) !== -1;
    });
  }

  function scheduleRows() {
    var rows = S.data.availability || [];
    if (S.role === 'doctor') {
      return rows.filter(function (a) { return a.clinicId === S.clinicId; });
    }
    return rows.filter(function (a) { return a.doctorId === S.doctorId && a.clinicId === S.clinicId; });
  }

  function reasonsForSchedule(doctorId, clinicId) {
    return (S.data.reasons || []).filter(function (r) {
      return r.active && r.doctorId === doctorId && (r.clinicIds || []).indexOf(clinicId) !== -1;
    });
  }

  function groupBlocks(rows) {
    var map = {};
    rows.forEach(function (a) {
      var key = [a.doctorId, a.clinicId, a.reasonId, a.fromTime, a.toTime, a.slotMin, a.maxPerDay, a.validFrom, a.validTo, a.active].join('|');
      if (!map[key]) {
        map[key] = {
          doctorId: a.doctorId, clinicId: a.clinicId, reasonId: a.reasonId,
          fromTime: a.fromTime, toTime: a.toTime, slotMin: a.slotMin,
          maxPerDay: a.maxPerDay, validFrom: a.validFrom, validTo: a.validTo,
          active: a.active, ids: [], weekdays: []
        };
      }
      map[key].ids.push(a.id);
      map[key].weekdays.push(Number(a.weekday));
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
      return (reasonName(a.reasonId) + a.fromTime).localeCompare(reasonName(b.reasonId) + b.fromTime);
    });
  }

  function renderSchedule() {
    var docs = S.role === 'doctor' ? null : (S.data.doctors || []).filter(function (d) { return d.active; });
    var branches = branchesFor(S.role === 'doctor' ? S.data.doctor.id : S.doctorId);
    var html = '<div class="card"><h2>الجدول الأسبوعي</h2><p class="hint">' +
      (S.role === 'doctor' ? 'هذه مواعيدك. أي تعديل يظهر للمرضى فوراً.' : 'اختر الطبيب والفرع، ثم أضف أو عدّل أوقات كل سبب زيارة.') + '</p>';

    if (S.role !== 'doctor') {
      if (!docs || !docs.length) {
        html += '<div class="empty">أضف طبيباً أولاً من قسم الأطباء.</div></div>';
        return html;
      }
      html += '<label class="field">الطبيب<select id="sched-doctor" onchange="setScheduleDoctor(this.value)">' +
        docs.map(function (d) {
          return '<option value="' + d.id + '" ' + (d.id === S.doctorId ? 'selected' : '') + '>' +
            esc(d.nameAr) + (d.active ? '' : ' (مؤرشف)') + '</option>';
        }).join('') + '</select></label>';
    } else {
      html += '<div class="msg info"><b>' + esc(S.data.doctor.nameAr) + '</b> — ' + esc(S.data.doctor.specialtyAr || '') + '</div>';
    }

    if (!branches.length) {
      html += '<div class="empty">لا يوجد فرع نشط مرتبط بهذا الطبيب. راجع الإدارة أو أضف فرعاً للطبيب.</div></div>';
      return html;
    }
    html += '<label class="field">الفرع<select id="sched-clinic" onchange="setScheduleClinic(this.value)">' +
      branches.map(function (c) {
        return '<option value="' + c.id + '" ' + (c.id === S.clinicId ? 'selected' : '') + '>' + esc(c.nameAr) + '</option>';
      }).join('') + '</select></label>';

    var schedDoctorId = S.role === 'doctor' ? S.data.doctor.id : S.doctorId;
    if (!reasonsForSchedule(schedDoctorId, S.clinicId).length) {
      html += '<div class="msg info">لا توجد أسباب زيارة نشطة لهذا الطبيب في هذا الفرع. أضف سبباً من قسم «أسباب الزيارة»' +
        (S.role === 'doctor' ? ' (تبويب «أسبابي»)' : '') + ' واختر هذا الفرع، ثم أضف له وقتاً.</div>';
    }

    var groups = groupBlocks(scheduleRows());
    html += '<div class="addbar"><button class="btn" onclick="openBlock()">+ إضافة وقت</button></div>';
    if (!groups.length) {
      html += '<div class="empty">لا توجد أوقات لهذا الطبيب في هذا الفرع بعد.</div></div>';
      return html;
    }
    groups.forEach(function (g) {
      var r = reasonObj(g.reasonId);
      var slot = Number(g.slotMin) > 0 ? (Number(g.slotMin) + ' دقيقة') : ('مدة سبب الزيارة' + (r ? ' (' + Number(r.durationMin) + ' د)' : ''));
      html += '<div class="group ' + (g.active ? '' : 'inactive') + '">' +
        '<div class="head"><div><h3>' + esc(r ? r.nameAr : g.reasonId) + '</h3>' +
        '<div class="weeklist">' + g.weekdays.slice().sort(function (a, b) { return a - b; }).map(function (w) { return '<span>' + weekName(w) + '</span>'; }).join('') + '</div></div>' +
        activeBadge(g.active) + '</div>' +
        '<p class="mini" style="margin:9px 0 0"><span class="timebig">' + esc(time12(g.fromTime)) + ' – ' + esc(time12(g.toTime)) + '</span> · ' + esc(slot) +
        (g.maxPerDay ? ' · حتى ' + Number(g.maxPerDay) + ' موعداً يومياً' : '') +
        (g.validFrom || g.validTo ? ' · ' + esc(dateRangeText(g.validFrom, g.validTo)) : '') + '</p>' +
        '<div class="row-actions">' +
        '<button class="btn ghost mini-btn" onclick="openBlock(\'' + g.ids.join(',') + '\')">تعديل</button>' +
        '<button class="btn ghost mini-btn" onclick="deleteBlock(\'' + g.ids.join(',') + '\')">حذف</button>' +
        '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function setScheduleDoctor(id) {
    S.doctorId = id;
    S.clinicId = '';
    ensureScheduleSelection();
    render();
  }

  function setScheduleClinic(id) {
    S.clinicId = id;
    render();
  }

  function openBlock(idsCsv) {
    var ids = idsCsv ? String(idsCsv).split(',') : [];
    var current = scheduleRows();
    var rows = ids.length ? current.filter(function (a) { return ids.indexOf(a.id) !== -1; }) : [];
    var base = rows.length ? rows[0] : {
      reasonId: '', fromTime: '09:00', toTime: '17:00', slotMin: 0,
      maxPerDay: 0, validFrom: '', validTo: '', active: true
    };
    var schedDoctorId = S.role === 'doctor' ? S.data.doctor.id : S.doctorId;
    var activeReasons = reasonsForSchedule(schedDoctorId, S.clinicId);
    if (!activeReasons.length) {
      toast('لا توجد أسباب زيارة نشطة لهذا الطبيب في هذا الفرع. أضف سبباً أولاً من قسم أسباب الزيارة.');
      return;
    }
    if (base.reasonId) {
      var baseReason = reasonObj(base.reasonId);
      if (!baseReason || !baseReason.active || baseReason.doctorId !== schedDoctorId ||
          (baseReason.clinicIds || []).indexOf(S.clinicId) === -1) {
        toast('سبب الزيارة المرتبط بهذا الوقت لم يعد متاحاً لهذا الطبيب أو الفرع. احذف الوقت وأضف وقتاً جديداً.');
        return;
      }
    }
    if (!base.reasonId || !activeReasons.some(function (r) { return r.id === base.reasonId; })) {
      base.reasonId = activeReasons[0].id;
    }
    S.editor = {
      ids: ids,
      weekdays: rows.map(function (a) { return Number(a.weekday); }),
      doctorId: schedDoctorId,
      clinicId: S.clinicId
    };
    var reasonOpts = activeReasons.map(function (r) {
      return '<option value="' + r.id + '" ' + (r.id === base.reasonId ? 'selected' : '') + '>' + esc(r.nameAr) + '</option>';
    }).join('');
    var wd = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'].map(function (label, i) {
      return '<button type="button" class="' + (S.editor.weekdays.indexOf(i) !== -1 ? 'on' : '') + '" onclick="toggleWeekday(' + i + ',this)">' + label + '</button>';
    }).join('');
    openModal(
      '<h2>' + (ids.length ? 'تعديل وقت' : 'إضافة وقت') + '</h2>' +
      '<p class="hint">اختر سبب الزيارة والأيام، ثم وقت البداية والنهاية. يمكنك اختيار أكثر من يوم بنفس التوقيت.' +
      (ids.length ? ' لتغيير سبب هذا الوقت، احذفه وأضف وقتاً جديداً.' : '') + '</p>' +
      '<label class="field">سبب الزيارة<select id="bl-reason"' + (ids.length ? ' disabled' : '') + '>' + reasonOpts + '</select></label>' +
      '<div class="field">أيام الأسبوع<div class="weekdays" id="bl-weekdays">' + wd + '</div></div>' +
      '<div class="two"><label class="field">من<input id="bl-from" type="time" value="' + esc(base.fromTime) + '"></label>' +
      '<label class="field">إلى<input id="bl-to" type="time" value="' + esc(base.toTime) + '"></label></div>' +
      '<div class="two"><label class="field">مدة الموعد (دقيقة، 0 = مدة السبب)<input id="bl-slot" type="number" min="0" max="240" value="' + Number(base.slotMin) + '"></label>' +
      '<label class="field">حد يومي (0 = حد السبب)<input id="bl-max" type="number" min="0" max="100" value="' + Number(base.maxPerDay) + '"></label></div>' +

  function toggleWeekday(n, btn) {
    var list = (S.editor && S.editor.weekdays) || [];
    var i = list.indexOf(n);
    if (i === -1) { list.push(n); btn.classList.add('on'); }
    else { list.splice(i, 1); btn.classList.remove('on'); }
    S.editor.weekdays = list;
  }

  function saveBlock() {
    var weekdays = (S.editor && S.editor.weekdays) || [];
    var from = el('bl-from').value, to = el('bl-to').value;
    var validFrom = el('bl-valid-from').value, validTo = el('bl-valid-to').value;
    if (!weekdays.length) { toast('اختر يوماً واحداً على الأقل.'); return; }
    if (!from || !to || from >= to) { toast('وقت البداية يجب أن يكون قبل وقت النهاية.'); return; }
    if (validFrom && validTo && validFrom > validTo) { toast('تاريخ البداية بعد تاريخ النهاية.'); return; }
    var payload = {
      ids: (S.editor && S.editor.ids) || [],
      doctorId: S.role === 'doctor' ? S.data.doctor.id : S.doctorId,
      clinicId: S.clinicId,
      reasonId: el('bl-reason').value,
      weekdays: weekdays,
      fromTime: from,
      toTime: to,
      slotMin: el('bl-slot').value,
      maxPerDay: el('bl-max').value,
      validFrom: validFrom,
      validTo: validTo,
      active: el('bl-active').checked
    };
    busy(el('btn-save'), true, 'جاري الحفظ…');
    api('adminSave', S.code, 'availability', payload).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save'), false); toast(failText(res, 'تعذّر حفظ الجدول.')); return; }
      finishSave('تم حفظ الجدول.');
    }).catch(function (err) { busy(el('btn-save'), false); toast('خطأ: ' + err); });
  }

  function deleteBlock(idsCsv) {
    if (!window.confirm('حذف هذا الوقت من الجدول؟ الحجوزات القائمة لا تتأثر.')) return;
    var ids = String(idsCsv || '').split(',').filter(Boolean);
    if (!ids.length) return;
    api('adminDelete', S.code, 'availability', ids).then(function (res) {
      if (!res || !res.ok) { toast(failText(res, 'تعذّر الحذف.')); return; }
      finishSave('تم حذف الوقت.');
    }).catch(function (err) { toast('خطأ: ' + err); });
  }

      '<div class="addbar"><button class="btn" onclick="openBlackout()">+ إضافة إغلاق</button></div>';

      html += '<div class="empty">لا توجد إغلاقات مسجلة.</div></div>';
      return html;

  function openBlackout() {
    var today = (S.data.meta && S.data.meta.today) || '';
    openModal(
      '<h2>إضافة إغلاق</h2><p class="hint">اترك الوقت فارغاً لإغلاق اليوم كله.</p>' +
      '<div class="two"><label class="field">من تاريخ<input id="bk-from-date" type="date" value="' + esc(today) + '"></label>' +
      '<label class="field">إلى تاريخ<input id="bk-to-date" type="date" value="' + esc(today) + '"></label></div>' +
      '<label class="field">النطاق<select id="bk-scope" onchange="updateBlackoutScope()">' +
      '<option value="all">كل العيادة</option><option value="clinic">فرع واحد</option><option value="doctor">طبيب واحد</option></select></label>' +

      '<div class="two"><label class="field">من وقت (اختياري)<input id="bk-from-time" type="time"></label>' +

  function updateBlackoutScope() {
    var wrap = el('bk-scope-wrap');
    if (!wrap) return;
    var type = el('bk-scope').value;
    if (type === 'all') { wrap.innerHTML = ''; return; }
    var options = '';
    if (type === 'clinic') {
      options = (S.data.clinics || []).filter(function (c) { return c.active; }).map(function (c) {
        return '<option value="' + c.id + '">' + esc(c.nameAr) + '</option>';
      }).join('');
    } else {
      options = (S.data.doctors || []).filter(function (d) { return d.active; }).map(function (d) {
        return '<option value="' + d.id + '">' + esc(d.nameAr) + '</option>';
      }).join('');
    }
    wrap.innerHTML = options
      ? '<label class="field">' + (type === 'clinic' ? 'الفرع' : 'الطبيب') + '<select id="bk-scope-id">' + options + '</select></label>'
      : '<div class="msg info">لا يوجد عنصر نشط لهذا النطاق.</div>';
  }

  function saveBlackout() {
    var type = el('bk-scope').value;
    var scopeEl = el('bk-scope-id');
    var payload = {
      dateFrom: el('bk-from-date').value,
      dateTo: el('bk-to-date').value,
      scopeType: type,
      scopeId: type === 'all' ? '' : (scopeEl ? scopeEl.value : ''),
      fromTime: el('bk-from-time').value,
      toTime: el('bk-to-time').value,
      note: el('bk-note').value
    };
    if (!payload.dateFrom || !payload.dateTo) { toast('اختر التاريخ.'); return; }
    if (type !== 'all' && !payload.scopeId) { toast('اختر الفرع أو الطبيب.'); return; }
    busy(el('btn-save'), true, 'جاري الحفظ…');
    api('adminSave', S.code, 'blackout', payload).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save'), false); toast(failText(res, 'تعذّر حفظ الإغلاق.')); return; }
      finishSave('تم حفظ الإغلاق.');
    }).catch(function (err) { busy(el('btn-save'), false); toast('خطأ: ' + err); });
  }

  function deleteBlackout(id) {
    if (!window.confirm('حذف هذا الإغلاق؟')) return;
    api('adminDelete', S.code, 'blackout', [id]).then(function (res) {
      if (!res || !res.ok) { toast(failText(res, 'تعذّر الحذف.')); return; }
      finishSave('تم حذف الإغلاق.');
    }).catch(function (err) { toast('خطأ: ' + err); });
  }

  function renderMessages() {
    var html = '<div class="card"><h2>رسائل واتساب</h2><p class="hint">هذه هي الرسائل التي يفتحها الاستقبال بضغطة واحدة. اترك القالب فارغاً لاستعادة النص الأصلي.</p></div>';

    });

  function sampleVars() {
    var d = S.data;
    var doc = (d.doctors || []).filter(function (x) { return x.active; })[0];
    var clinic = (d.clinics || []).filter(function (x) { return x.active; })[0];
    var reason = (d.reasons || []).filter(function (x) { return x.active; })[0];
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    var dateStr = tomorrow.getFullYear() + '-' + ('0' + (tomorrow.getMonth() + 1)).slice(-2) + '-' + ('0' + tomorrow.getDate()).slice(-2);
    var mapLink = clinic ? clinic.mapLink : '';
    var address = clinic ? clinic.addressAr : '';
    return {
      name: 'أحمد',
      bookingId: (doc ? doc.code : 'dr') + '-' + dateStr.replace(/-/g, '') + '-1',
      doctor: doc ? doc.nameAr : 'د. أحمد',
      clinic: d.settings.clinicName,
      address: address,
      mapLink: mapLink,
      addressBlock: (address ? '📍 ' + address + '\n' : '') + (mapLink ? 'الموقع على الخريطة:\n' + mapLink + '\n\n' : ''),
      reason: reason ? reason.nameAr : 'استشارة',
      dateAr: 'غداً ' + tomorrow.getDate() + '/' + (tomorrow.getMonth() + 1),
      whenAr: 'غداً',
      timeAr: '9:00 ص',
      phone: '+201000000000'
    };
  }

  function previewText(text) {
    var vars = sampleVars();
    return String(text || '').replace(/\{(\w+)\}/g, function (m, key) {
      return vars[key] === undefined ? m : vars[key];
    });
  }

  function previewTemplate(key) {
    var box = el('prev-' + key);
    var input = el('tpl-' + key);
    if (!box || !input) return;
    var shown = previewText(input.value);
    box.innerHTML = esc(shown).replace(/\n/g, '<br>');
    var unknown = shown.match(/\{\w+\}/g);
    if (unknown) box.innerHTML += '<div class="unknown">متغير غير معروف: ' + esc(unknown.join('، ')) + '</div>';
  }

  function insertPlaceholder(key, token) {
    var input = el('tpl-' + key);
    if (!input) return;
    input.value += token;
    input.focus();
    previewTemplate(key);
  }

  function saveTemplate(key) {
    var text = el('tpl-' + key).value;
    busy(null, false);
    api('adminSave', S.code, 'template', { key: key, text: text }).then(function (res) {
      if (!res || !res.ok) { toast(failText(res, 'تعذّر حفظ الرسالة.')); return; }
      finishSave('تم حفظ الرسالة.');
    }).catch(function (err) { toast('خطأ: ' + err); });
  }

  function resetTemplate(key) {
    if (!window.confirm('استعادة النص الافتراضي لهذه الرسالة؟')) return;
    api('adminSave', S.code, 'template', { key: key, text: '' }).then(function (res) {
      if (!res || !res.ok) { toast(failText(res, 'تعذّرت الاستعادة.')); return; }
      finishSave('تمت استعادة النص الافتراضي.');
    }).catch(function (err) { toast('خطأ: ' + err); });
  }

  function textField(key, label, value, def, multiline) {
    var id = 'txt-' + key;

      ? '<textarea id="' + id + '" rows="3" maxlength="1200">' + esc(value) + '</textarea>'
      : '<input id="' + id + '" value="' + esc(value) + '" maxlength="1200">';
    return '<label class="field">' + esc(label) + input +
      '<span class="why">الافتراضي: ' + esc(def) + ' <button type="button" class="btn link" style="display:inline;padding:0;min-height:auto" onclick="resetText(\'' + key + '\')">استعادة</button></span></label>';
  }

  function resetText(key) {
    var input = el('txt-' + key);
    if (input) input.value = (S.data.settings.textDefaults || {})[key] || '';
  }

  function saveTexts() {
    var keys = ['subtitle', 'consentText', 'successText', 'nameHint', 'phoneHint', 'extraLabel', 'noSlots', 'slotTaken'];

      var input = el('txt-' + k);
      if (input) texts[k] = input.value;
    });
    busy(el('btn-save-texts'), true, 'جاري الحفظ…');
    api('adminSave', S.code, 'texts', { texts: texts }).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save-texts'), false); toast(failText(res, 'تعذّر حفظ النصوص.')); return; }
      toast('تم حفظ النصوص.');
      loadData();
    }).catch(function (err) { busy(el('btn-save-texts'), false); toast('خطأ: ' + err); });

  function saveSecurity() {
    var staff = (el('set-staff').value || '').trim();
    var admin = (el('set-admin').value || '').trim();
    if (!staff && !admin) { toast('اكتب كوداً جديداً أولاً.'); return; }
    if (admin && admin.length < 6) { toast('كود الإدارة يجب أن يكون 6 أحرف على الأقل.'); return; }
    var values = {};
    if (staff) values.staffCode = staff;
    if (admin) values.adminCode = admin;
    busy(el('btn-save-security'), true, 'جاري الحفظ…');
    api('adminSave', S.code, 'settings', { values: values }).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save-security'), false); toast(failText(res, 'تعذّر حفظ الأكواد.')); return; }
      var msg = 'تم حفظ أكواد الدخول.';
      if (res.adminCodeChanged) {
        rememberCode(admin);
        S.code = admin;
        msg = 'تم تغيير كود الإدارة. احفظ الكود الجديد.';
      }
      toast(msg);
      loadData();
    }).catch(function (err) { busy(el('btn-save-security'), false); toast('خطأ: ' + err); });
  }

  function doAnnualExport() {
    var btn = el('btn-annual');
    if (btn) busy(btn, true, 'جاري تصدير البيانات…');
    api('adminAnnualExport', S.code).then(function (res) {
      if (btn) busy(btn, false);
      if (!res || !res.ok) { toast(failText(res, 'تعذّر إنشاء النسخة السنوية.')); return; }
      openModal('<h2>النسخة السنوية جاهزة</h2>' +
        '<p class="hint">' + esc(res.fileName || '') + ' — ' + Number(res.rows || 0) + ' صف. احفظ الملف خارج Google Drive.</p>' +
        '<div class="actions"><a class="btn wide" href="' + esc(res.url) + '" target="_blank" rel="noopener">فتح ملف Excel</a>' +
        '<button class="btn ghost wide" onclick="closeModal();loadData()">إغلاق</button></div>');
      loadData();
    }).catch(function (err) {
      if (btn) busy(btn, false);
      toast('خطأ: ' + err);
    });
  }

  function doBackup() {
    var btn = el('btn-backup');
    if (btn) busy(btn, true, 'جاري إنشاء النسخة…');
    api('adminBackup', S.code).then(function (res) {
      if (btn) busy(btn, false);
      if (!res || !res.ok) { toast(failText(res, 'تعذّر إنشاء النسخة الاحتياطية.')); return; }
      openModal('<h2>تم إنشاء نسخة احتياطية</h2><p class="hint">' + esc(res.name || '') + '</p>' +
        '<div class="actions"><a class="btn wide" href="' + esc(res.url) + '" target="_blank" rel="noopener">فتح النسخة في درايف</a>' +
        '<button class="btn ghost wide" onclick="closeModal()">إغلاق</button></div>');
    }).catch(function (err) { if (btn) busy(btn, false); toast('خطأ: ' + err); });
  }

  /* ------------------------------------------------------------------ *
   * Audit
   * ------------------------------------------------------------------ */

  function renderAudit() {
    return '<div class="card"><h2>سجل التعديلات</h2><p class="hint">آخر التغييرات التي تمت من صفحة الإعدادات.</p>' +
      auditList(S.data.audit || []) + '</div>';
  }

  /* ------------------------------------------------------------------ *
   * Doctor security
   * ------------------------------------------------------------------ */

  function renderDoctorSecurity() {
    return '<div class="card"><h2>كود الدخول</h2><p class="hint">هذا الكود يفتح صفحة الإعدادات ويسمح لك بتعديل جدولك فقط. لا تشاركه.</p>' +
      '<label class="field">كود جديد (4–8 أرقام)<input id="my-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" dir="ltr"></label>' +
      '<label class="field">تأكيد الكود<input id="my-pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="off" dir="ltr"></label>' +
      '<div class="actions"><button class="btn wide" id="btn-save-pin" onclick="saveMyPin()">حفظ الكود</button></div>' +
      '<p class="mini">إذا نسيت الكود، اطلب من الإدارة إعادة تعيينه.</p></div>' +
      '<div class="card"><h2>ملاحظة</h2><p class="hint">يمكنك إضافة أسباب زيارتك من تبويب «أسبابي»، ثم إضافة أوقاتها من تبويب «مواعيدي». كل سبب يخصك وحدك، وأرشفته تحذف أوقاته من جدولك. لتغيير الفرع أو التخصص، تواصل مع الإدارة.</p></div>';
  }

  function saveMyPin() {
    var pin = (el('my-pin').value || '').trim();
    var pin2 = (el('my-pin2').value || '').trim();
    if (!/^\d{4,8}$/.test(pin)) { toast('الكود يجب أن يكون من 4 إلى 8 أرقام.'); return; }
    if (pin !== pin2) { toast('الكود وتأكيده غير متطابقين.'); return; }
    busy(el('btn-save-pin'), true, 'جاري الحفظ…');
    api('adminChangePin', S.code, pin).then(function (res) {
      if (!res || !res.ok) { busy(el('btn-save-pin'), false); toast(failText(res, 'تعذّر حفظ الكود.')); return; }
      rememberCode(pin);
      S.code = pin;
      toast('تم تغيير كودك.');
      loadData();
    }).catch(function (err) { busy(el('btn-save-pin'), false); toast('خطأ: ' + err); });
  }

  /* ------------------------------------------------------------------ *
   * Shared ordering / modal / finish
   * ------------------------------------------------------------------ */

  function moveEntity(section, id, direction) {
    var list = section === 'clinics' ? (S.data.clinics || []) :
      section === 'doctors' ? (S.data.doctors || []) : (S.data.reasons || []);
    var ids = list.map(function (x) { return x.id; });
    var i = ids.indexOf(id);
    var j = i + direction;
    if (i < 0 || j < 0 || j >= ids.length) return;
    var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
    api('adminReorder', S.code, section, ids).then(function (res) {
      if (!res || !res.ok) { toast(failText(res, 'تعذّر الترتيب.')); return; }
      loadData();
    }).catch(function (err) { toast('خطأ: ' + err); });
  }

  function openModal(html) {
    var m = el('modal');
    m.innerHTML = '<div class="sheet">' + html + '</div>';
    m.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    var m = el('modal');
    if (!m) return;
    m.classList.remove('open');
    m.innerHTML = '';
    document.body.style.overflow = '';
  }

  function modalBackdrop(event) {
    if (event && event.target && event.target.id === 'modal') closeModal();
  }

  function finishSave(message) {
    closeModal();
    if (message) toast(message);
    loadData();
  }

  start();
</script>
</body>
</html>
