/**
 * Availability.gs — the slot engine.
 *
 * Pure function of the spreadsheet's contents. It never writes anything, which
 * is what makes it safe to call from the public booking page and easy to test
 * locally (see tools/local-test.mjs).
 *
 * Rules, in order:
 *   1. the doctor must handle this clinic, and have an Availability row for this reason
 *   2. the date must be inside the doctor's booking window (book_days_ahead)
 *   3. the slot must respect the minimum lead time
 *   4. the slot must not fall inside a Blackout
 *   5. the slot must not already be taken (one patient per slot)
 *   6. the day must not exceed max_per_day (reason level, or the Availability override)
 */

const MAX_SLOT_DAYS = 90;

function generateSlots(req) {
  req = req || {};
  const settings = getSettings();
  const clinicId = str(req.clinicId);
  const doctorId = str(req.doctorId);
  const reasonId = str(req.reasonId);

  const windowDays = Math.min(
    Math.max(Number(req.days) || Number(settings[SETTING.BOOKING_WINDOW_DAYS]) || 14, 1),
    MAX_SLOT_DAYS
  );

  const clinic = Db.findById(SHEET.CLINICS, 'clinic_id', clinicId);
  const doctor = Db.findById(SHEET.DOCTORS, 'doctor_id', doctorId);
  const reason = Db.findById(SHEET.REASONS, 'reason_id', reasonId);

  if (!clinic || !isActive(clinic)) return { ok: false, error: 'CLINIC_NOT_FOUND' };
  if (!doctor || !isActive(doctor)) return { ok: false, error: 'DOCTOR_NOT_FOUND' };
  if (!reason || !isActive(reason)) return { ok: false, error: 'REASON_NOT_FOUND' };

  const clinicIds = str(doctor.clinic_ids).split(',').map(function (s) { return s.trim(); });
  if (clinicIds.indexOf(clinicId) === -1) return { ok: false, error: 'DOCTOR_NOT_IN_CLINIC' };

  const slotLen = Number(reason.duration_min) || 30;
  const reasonMaxPerDay = Number(reason.max_per_day) || 0; // 0 = unlimited
  const leadMinutes = Math.max(
    Number(reason.lead_hours) >= 0 && str(reason.lead_hours) !== ''
      ? Number(reason.lead_hours) * 60
      : Number(settings[SETTING.MIN_LEAD_HOURS]) * 60,
    0
  );
  const reasonDaysAhead = Number(reason.book_days_ahead) || windowDays;
  const horizon = Math.min(windowDays, reasonDaysAhead);

  const avail = Db.rows(SHEET.AVAILABILITY).filter(function (a) {
    return isActive(a) &&
      str(a.doctor_id) === doctorId &&
      str(a.clinic_id) === clinicId &&
      str(a.reason_id) === reasonId;
  });

  if (!avail.length) {
    return {
      ok: true,
      empty: true,
      reason: reasonPublic(reason, slotLen),
      doctor: doctorPublic(doctor),
      clinic: clinicPublic(clinic),
      days: []
    };
  }

  const blackouts = Db.rows(SHEET.BLACKOUTS);
  const occupancy = buildOccupancy(doctorId);
  const today = todayStr();
  const nowMin = nowMinutes();
  const cutoffMin = nowMin + leadMinutes;

  const days = [];
  for (let i = 0; i < horizon; i++) {
    const date = addDaysStr(today, i);
    if (date < today) continue;
    const wd = weekdayIndex(date);

    const dayRows = avail.filter(function (a) {
      return Number(a.weekday) === wd && withinValidRange(a, date);
    });
    if (!dayRows.length) continue;

    const dayCount = (occupancy.byDoctorDate[doctorId + '|' + date] || 0);
    const reasonCount = (occupancy.byDoctorDateReason[doctorId + '|' + date + '|' + reasonId] || 0);
    const slots = [];

    dayRows.forEach(function (a) {
      const maxPerDay = Number(a.max_per_day_override) || reasonMaxPerDay;
      const from = parseTimeToMin(a.from_time);
      const to = parseTimeToMin(a.to_time);
      if (from === null || to === null || to <= from) {
        logWarn('generateSlots', 'Bad availability window ignored: ' + JSON.stringify(a));
        return;
      }
      const step = Number(a.slot_min) || slotLen;

      for (let start = from; start + step <= to; start += step) {
        const end = start + step;
        if (date === today && start < cutoffMin) continue;
        if (isBlackedOut(blackouts, date, start, end, clinicId, doctorId)) continue;
        const taken = occupancy.byDoctorDateStart[doctorId + '|' + date + '|' + minToTime(start)];
        if (taken) continue;
        if (maxPerDay > 0 && (dayCount + slots.length) >= maxPerDay) continue;
        if (reasonMaxPerDay > 0 && (reasonCount + slots.length) >= reasonMaxPerDay) continue;
        slots.push({
          start: minToTime(start),
          end: minToTime(end),
          labelAr: minToTimeAr(start)
        });
      }
    });

    if (slots.length) {
      days.push({
        date: date,
        weekdayAr: weekdayAr(date),
        labelAr: formatDateAr(date),
        isToday: date === today,
        slots: slots
      });
    }
  }

  return {
    ok: true,
    empty: days.length === 0,
    reason: reasonPublic(reason, slotLen),
    doctor: doctorPublic(doctor),
    clinic: clinicPublic(clinic),
    days: days
  };
}

/** Collect the occupancy data the engine needs, in one pass. */
function buildOccupancy(doctorId) {
  const out = { byDoctorDate: {}, byDoctorDateReason: {}, byDoctorDateStart: {} };
  Db.rows(SHEET.BOOKINGS).forEach(function (b) {
    if (str(b.doctor_id) !== doctorId) return;
    if (OCCUPYING_STATUSES.indexOf(str(b.status)) === -1) return;
    const date = str(b.date);
    const start = str(b.start_time);
    if (!date || !start) return;
    const dKey = doctorId + '|' + date;
    out.byDoctorDate[dKey] = (out.byDoctorDate[dKey] || 0) + 1;
    const rKey = dKey + '|' + str(b.reason_id);
    out.byDoctorDateReason[rKey] = (out.byDoctorDateReason[rKey] || 0) + 1;
    out.byDoctorDateStart[dKey + '|' + start] = true;
  });
  return out;
}

/** Blackout.scope_type is 'all', 'clinic' or 'doctor'. date may be 'YYYY-MM-DD' or 'start..end'. */
function isBlackedOut(blackouts, dateStr, startMin, endMin, clinicId, doctorId) {
  for (let i = 0; i < blackouts.length; i++) {
    const b = blackouts[i];
    const scope = str(b.scope_type) || 'all';
    if (scope === 'clinic' && str(b.scope_id) !== clinicId) continue;
    if (scope === 'doctor' && str(b.scope_id) !== doctorId) continue;
    if (!dateMatches(b.date, dateStr)) continue;
    const bf = parseTimeToMin(b.from_time);
    const bt = parseTimeToMin(b.to_time);
    if (bf === null || bt === null) return true; // whole day
    if (overlaps(startMin, endMin, bf, bt)) return true;
  }
  return false;
}

function dateMatches(spec, dateStr) {
  const s = str(spec);
  if (!s) return false;
  const idx = s.indexOf('..');
  if (idx === -1) return s === dateStr;
  const from = s.slice(0, idx).trim();
  const to = s.slice(idx + 2).trim();
  return dateStr >= from && dateStr <= to;
}

function withinValidRange(availabilityRow, dateStr) {
  const from = str(availabilityRow.valid_from);
  const to = str(availabilityRow.valid_to);
  if (from && dateStr < from) return false;
  if (to && dateStr > to) return false;
  return true;
}

function isActive(row) {
  return isTrue(row.active) || (str(row.active) === '' && row.active !== false);
}

function doctorPublic(doctor) {
  return { id: str(doctor.doctor_id), nameAr: str(doctor.name_ar), specialtyAr: str(doctor.specialty_ar) };
}

function clinicPublic(clinic) {
  return {
    id: str(clinic.clinic_id),
    nameAr: str(clinic.name_ar),
    addressAr: str(clinic.address_ar),
    mapLink: str(clinic.map_link),
    phone: str(clinic.phone),
    workingHoursAr: str(clinic.working_hours_ar)
  };
}

function reasonPublic(reason, slotLen) {
  return {
    id: str(reason.reason_id),
    nameAr: str(reason.name_ar),
    descriptionAr: str(reason.description_ar),
    durationMin: slotLen
  };
}

/** Authoritative yes/no for one exact slot. Used by BookingApi.gs under lock. */
function findSlot(req, date, start) {
  const res = generateSlots(req);
  if (!res.ok) return null;
  for (let i = 0; i < res.days.length; i++) {
    const day = res.days[i];
    if (day.date !== date) continue;
    for (let j = 0; j < day.slots.length; j++) {
      if (day.slots[j].start === start) return { day: day, slot: day.slots[j], context: res };
    }
  }
  return null;
}

/**
 * Calendar.gs — the shared clinic calendar is a *mirror* of the Bookings sheet.
 *
 * The sheet is authoritative. The calendar exists so the reception sees a
 * normal agenda and so the doctor's day is visible at a glance.
 *
 * Unavailability therefore has two supported routes:
 *   - add a row to the Blackouts sheet (precise, per doctor/clinic/day)
 *   - create a calendar event whose title starts with BLOCK, and the nightly
 *     syncBlockEvents() turns it into a Blackout row automatically
 */

const BLOCK_PREFIX = 'BLOCK';

function ensureSharedCalendar() {
  const settings = getSettings();
  const existingId = str(settings[SETTING.CALENDAR_ID]);
  if (existingId) {
    try {
      const cal = CalendarApp.getCalendarById(existingId);
      if (cal) return cal;
    } catch (err) {
      logWarn('ensureSharedCalendar', 'Stored calendar id unusable: ' + err);
    }
  }
  const name = str(settings[SETTING.CALENDAR_NAME]) || 'Clinic appointments';
  const cal = CalendarApp.createCalendar(name, {
    summary: 'مواعيد ' + str(settings[SETTING.CLINIC_NAME]),
    timeZone: str(settings[SETTING.TIMEZONE]) || 'Africa/Cairo'
  });
  setSetting(SETTING.CALENDAR_ID, cal.getId());
  logInfo('ensureSharedCalendar', 'Created calendar ' + cal.getId());
  return cal;
}

function calendarEventTimes(booking) {
  const startMin = parseTimeToMin(booking.start_time);
  const endMin = parseTimeToMin(booking.end_time);
  const base = parseDateStr(str(booking.date));
  const start = new Date(base.getFullYear(), base.getMonth(), base.getDate(), Math.floor(startMin / 60), startMin % 60);
  const end = new Date(base.getFullYear(), base.getMonth(), base.getDate(), Math.floor(endMin / 60), endMin % 60);
  return { start: start, end: end };
}

function eventTitle(booking, doctor, reason, clinic) {
  const who = str(booking.name) || str(booking.phone_norm) || 'مريض';
  return '[' + str(doctor.name_ar) + '] ' + str(reason.name_ar) + ' — ' + who;
}

function eventDescription(booking, doctor, reason, clinic) {
  return [
    'رقم الحجز: ' + str(booking.booking_id),
    'الطبيب: ' + str(doctor.name_ar),
    'سبب الزيارة: ' + str(reason.name_ar),
    'الفرع: ' + str(clinic.name_ar),
    'الجوال: ' + str(booking.phone_norm),
    'الاسم: ' + (str(booking.name) || '—'),
    str(booking.extra_json) ? 'ملاحظات: ' + str(booking.extra_json) : ''
  ].filter(String).join('\n');
}

function colorForDoctor(colorName) {
  const map = {
    red: CalendarApp.Color.RED,
    orange: CalendarApp.Color.ORANGE,
    yellow: CalendarApp.Color.YELLOW,
    green: CalendarApp.Color.GREEN,
    teal: CalendarApp.Color.TEAL,
    blue: CalendarApp.Color.BLUE,
    purple: CalendarApp.Color.PURPLE,
    gray: CalendarApp.Color.GRAY
  };
  return map[str(colorName).toLowerCase()] || null;
}

/** Returns the event id, or '' when the calendar step failed (the booking still stands). */
function createEventForBooking(booking) {
  try {
    const cal = ensureSharedCalendar();
    const doctor = Db.findById(SHEET.DOCTORS, 'doctor_id', str(booking.doctor_id)) || {};
    const reason = Db.findById(SHEET.REASONS, 'reason_id', str(booking.reason_id)) || {};
    const clinic = Db.findById(SHEET.CLINICS, 'clinic_id', str(booking.clinic_id)) || {};
    const t = calendarEventTimes(booking);
    const event = cal.createEvent(eventTitle(booking, doctor, reason, clinic), t.start, t.end, {
      description: eventDescription(booking, doctor, reason, clinic),
      location: str(clinic.address_ar)
    });
    const color = colorForDoctor(doctor.color);
    if (color) {
      try { event.setColor(color); } catch (e) { /* color is cosmetic */ }
    }
    return event.getId();
  } catch (err) {
    logError('createEventForBooking', 'Calendar event failed for ' + str(booking.booking_id) + ': ' + err);
    return '';
  }
}

function deleteEventForBooking(booking) {
  const eventId = str(booking.event_id);
  if (!eventId) return false;
  try {
    const event = CalendarApp.getEventById(eventId);
    if (!event) return false;
    event.deleteEvent();
    return true;
  } catch (err) {
    logError('deleteEventForBooking', 'Could not delete event ' + eventId + ': ' + err);
    return false;
  }
}

function moveEventForBooking(booking) {
  const eventId = str(booking.event_id);
  if (!eventId) return false;
  try {
    const event = CalendarApp.getEventById(eventId);
    if (!event) return false;
    const t = calendarEventTimes(booking);
    event.setTime(t.start, t.end);
    return true;
  } catch (err) {
    logError('moveEventForBooking', 'Could not move event ' + eventId + ': ' + err);
    return false;
  }
}

function annotateEvent(booking, suffix) {
  const eventId = str(booking.event_id);
  if (!eventId) return false;
  try {
    const event = CalendarApp.getEventById(eventId);
    if (!event) return false;
    const title = event.getTitle();
    if (title.indexOf(suffix) === -1) event.setTitle(title + ' ' + suffix);
    return true;
  } catch (err) {
    logWarn('annotateEvent', 'Could not annotate event ' + eventId + ': ' + err);
    return false;
  }
}

/**
 * Nightly job: calendar events titled "BLOCK …" become Blackout rows, so
 * reception can block a doctor's day without touching the spreadsheet.
 * Idempotent — one blackout row per event, keyed by the event id.
 */
function syncBlockEvents(daysAhead) {
  const horizon = daysAhead || 60;
  const cal = ensureSharedCalendar();
  const from = new Date();
  const to = new Date(from.getTime() + horizon * 86400000);
  const existing = Db.rows(SHEET.BLACKOUTS).map(function (b) { return str(b.blackout_id); });
  const known = {};
  existing.forEach(function (id) { known[id] = true; });
  Db.rows(SHEET.AVAILABILITY); // no-op read keeps row order warm; harmless

  let created = 0;
  const events = cal.getEvents(from, to);
  events.forEach(function (event) {
    const title = str(event.getTitle());
    if (title.toUpperCase().indexOf(BLOCK_PREFIX) !== 0) return;
    const id = 'BLK-EVT-' + event.getId();
    if (known[id]) return;

    const scopeMatch = title.match(/\[([^\]]+)\]/); // BLOCK [doctor:D1] …
    const allDoctors = Db.rows(SHEET.DOCTORS);
    let scopeType = 'all';
    let scopeId = '';
    if (scopeMatch) {
      const parts = str(scopeMatch[1]).split(':');
      const key = str(parts[0]).toLowerCase();
      const val = str(parts[1]);
      const doc = allDoctors.filter(function (d) {
        return str(d.doctor_id) === val || str(d.name_ar) === val;
      })[0];
      const clinic = Db.rows(SHEET.CLINICS).filter(function (c) {
        return str(c.clinic_id) === val || str(c.name_ar) === val;
      })[0];
      if (key === 'doctor' && doc) { scopeType = 'doctor'; scopeId = str(doc.doctor_id); }
      if (key === 'clinic' && clinic) { scopeType = 'clinic'; scopeId = str(clinic.clinic_id); }
    }

    const start = event.getStartTime();
    const end = event.getEndTime();
    const dateStr = formatDateStr(start);
    const sameDay = formatDateStr(end) === dateStr;
    Db.append(SHEET.BLACKOUTS, {
      blackout_id: id,
      date: dateStr,
      scope_type: scopeType,
      scope_id: scopeId,
      from_time: sameDay ? minToTime(start.getHours() * 60 + start.getMinutes()) : '',
      to_time: sameDay ? minToTime(end.getHours() * 60 + end.getMinutes()) : '',
      note: title + ' (من التقويم)'
    });
    created++;
  });
  if (created) logInfo('syncBlockEvents', 'Created ' + created + ' blackout rows from calendar');
  return created;
}

/**
 * WhatsApp.gs — manual WhatsApp, by design.
 *
 * No API, no cost. Staff tap a link; WhatsApp opens with the Arabic message
 * pre-filled to that patient's number. Every tap is stamped on the booking row
 * (wa_sent_at / wa_template) so "did anyone remind this patient?" is answerable.
 */

/** wa.me needs digits only, country code included, no plus sign. */
function waNumberFrom(phoneNorm) {
  return String(phoneNorm || '').replace(/\D/g, '');
}

function waLink(phoneNorm, text) {
  const num = waNumberFrom(phoneNorm);
  if (!num) return '';
  return 'https://wa.me/' + num + '?text=' + encodeURIComponent(text);
}

/** Variables available to every template for one booking. */
function templateVars(booking) {
  const doctor = Db.findById(SHEET.DOCTORS, 'doctor_id', str(booking.doctor_id)) || {};
  const clinic = Db.findById(SHEET.CLINICS, 'clinic_id', str(booking.clinic_id)) || {};
  const reason = Db.findById(SHEET.REASONS, 'reason_id', str(booking.reason_id)) || {};
  const startMin = parseTimeToMin(booking.start_time);
  const dateStr = str(booking.date);

  // The location part of a message, ready to drop in: gone completely when the clinic
  // has not filled its address and map link yet, so no template ever shows a bare "📍".
  const addressBlock =
    (str(clinic.address_ar) ? '📍 ' + str(clinic.address_ar) + '\n' : '') +
    (str(clinic.map_link) ? 'الموقع على الخريطة:\n' + str(clinic.map_link) + '\n\n' : '');

  return {
    name: str(booking.name) || 'عميلنا',
    bookingId: str(booking.booking_id),
    doctor: str(doctor.name_ar),
    clinic: str(clinic.name_ar),
    address: str(clinic.address_ar),
    mapLink: str(clinic.map_link),
    addressBlock: addressBlock,
    reason: str(reason.name_ar),
    dateAr: formatDateAr(dateStr),
    whenAr: relativeDayAr(dateStr),
    timeAr: startMin === null ? '' : minToTimeAr(startMin),
    phone: str(booking.phone_norm)
  };
}

/** Every ready-to-tap link for one booking, in the order staff needs them. */
function waLinksFor(booking) {
  const vars = templateVars(booking);
  const phone = str(booking.phone_norm);
  const order = ['confirm', 'remind24', 'reschedule', 'cancel'];
  return order.map(function (key) {
    const tpl = WA_TEMPLATES[key];
    return {
      key: key,
      labelAr: tpl.labelAr,
      text: renderTemplate(tpl.text, vars),
      url: waLink(phone, renderTemplate(tpl.text, vars))
    };
  });
}

/** Text a patient can paste into any calendar app, plus a Google Calendar link. */
function calendarLinksFor(booking) {
  const startMin = parseTimeToMin(booking.start_time);
  const endMin = parseTimeToMin(booking.end_time);
  if (startMin === null || endMin === null) return { googleUrl: '', text: '' };
  const base = parseDateStr(str(booking.date));
  const start = new Date(base.getFullYear(), base.getMonth(), base.getDate(), Math.floor(startMin / 60), startMin % 60);
  const end = new Date(base.getFullYear(), base.getMonth(), base.getDate(), Math.floor(endMin / 60), endMin % 60);
  const stamp = function (d) {
    return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
      'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + '00Z';
  };
  const doctor = Db.findById(SHEET.DOCTORS, 'doctor_id', str(booking.doctor_id)) || {};
  const clinic = Db.findById(SHEET.CLINICS, 'clinic_id', str(booking.clinic_id)) || {};
  const reason = Db.findById(SHEET.REASONS, 'reason_id', str(booking.reason_id)) || {};
  const title = 'موعد ' + str(reason.name_ar) + ' — ' + str(doctor.name_ar);
  const params = [
    'action=TEMPLATE',
    'text=' + encodeURIComponent(title),
    'dates=' + stamp(start) + '/' + stamp(end),
    'details=' + encodeURIComponent('رقم الحجز: ' + str(booking.booking_id)),
    'location=' + encodeURIComponent(str(clinic.address_ar))
  ].join('&');
  return {
    googleUrl: 'https://calendar.google.com/calendar/render?' + params,
    text: title + '\n' + formatDateAr(str(booking.date)) + ' ' + minToTimeAr(startMin)
  };
}

function markWhatsAppSent(bookingId, templateKey) {
  const booking = Db.findById(SHEET.BOOKINGS, 'booking_id', bookingId);
  if (!booking) return { ok: false, error: 'NOT_FOUND' };
  Db.update(SHEET.BOOKINGS, 'booking_id', bookingId, {
    wa_sent_at: new Date().toISOString(),
    wa_template: str(templateKey)
  });
  return { ok: true };
}

/**
 * BookingApi.gs — the only place a patient writes to the system.
 *
 * Every rule is re-checked here under a script lock, because the client is
 * public and untrusted. The browser's idea of "available" means nothing.
 */

const MAX_FUTURE_BOOKINGS_PER_PHONE = 3;
const MAX_NAME_LENGTH = 80;
const MAX_EXTRA_LENGTH = 600;

/**
 * Booking references the patient can read back over the phone:
 *
 *   ae-20261018-1   →  the doctor's first booking on 18 Oct 2026
 *   ae-20261018-2   →  the second
 *
 * The doctor part is the `code` column in the Doctors sheet when the clinic fills it.
 * Otherwise it is improvised from the name: the first letters of the first and last
 * name (Ashraf Elzamany → ae). The Arabic table below is only a fallback, because
 * 'ا' can be a, e or i — a clinic that cares about the letters should set the code.
 */
const AR_TO_LATIN = {
  'ا': 'a', 'أ': 'a', 'إ': 'e', 'آ': 'a', 'ٱ': 'a', 'ب': 'b', 'ت': 't', 'ث': 't',
  'ج': 'j', 'ح': 'h', 'خ': 'k', 'د': 'd', 'ذ': 'z', 'ر': 'r', 'ز': 'z', 'س': 's',
  'ش': 's', 'ص': 's', 'ض': 'd', 'ط': 't', 'ظ': 'z', 'ع': 'a', 'غ': 'g', 'ف': 'f',
  'ق': 'q', 'ك': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n', 'ه': 'h', 'و': 'w', 'ي': 'y',
  'ى': 'a', 'ة': 'a', 'ء': 'a', 'ئ': 'y', 'ؤ': 'w'
};

/** First Latin letters of a name word, e.g. 'أحمد' → 'ah', 'Ashraf' → 'as'. */
function latinLetters(word) {
  let out = '';
  const s = str(word);
  for (let i = 0; i < s.length && out.length < 2; i++) {
    const ch = s[i];
    if (/[A-Za-z]/.test(ch)) out += ch.toLowerCase();
    else if (AR_TO_LATIN[ch]) out += AR_TO_LATIN[ch];
  }
  return out;
}

/** Short, lowercase code used in booking references. Never returns empty. */
function doctorCode(doctor) {
  const explicit = str(doctor && doctor.code).replace(/[^A-Za-z0-9]/g, '');
  if (explicit) return explicit.toLowerCase().slice(0, 4);

  const words = str(doctor && doctor.name_ar)
    .split(/\s+/)
    .map(function (w) { return w.replace(/[^\u0621-\u064AA-Za-z]/g, ''); })
    .filter(function (w) { return w && !/^(د|dr|doctor)$/i.test(w); });

  let code = '';
  if (words.length > 1) {
    code = latinLetters(words[0]).slice(0, 1) + latinLetters(words[words.length - 1]).slice(0, 1);
  }
  if (code.length < 2 && words.length) code = latinLetters(words[0]);
  if (code.length < 2) code = str(doctor && doctor.doctor_id).toLowerCase().replace(/[^a-z0-9]/g, '');
  return code.slice(0, 4) || 'dr';
}

/**
 * <doctor code>-<yyyymmdd>-<n>, where n is this doctor's n-th booking that day.
 *
 * Call inside the script lock. Rows are never deleted, so the counter only moves
 * forward: a cancelled booking keeps its number and the next one takes the next
 * number — two live bookings can never share a reference.
 */
function bookingRefFor(doctor, date) {
  const doctorId = str(doctor && doctor.doctor_id);
  const day = str(date);
  const seq = Db.rows(SHEET.BOOKINGS).filter(function (b) {
    return str(b.doctor_id) === doctorId && str(b.date) === day;
  }).length + 1;
  return doctorCode(doctor) + '-' + day.replace(/-/g, '') + '-' + seq;
}

function submitBooking(input) {
  input = input || {};
  const settings = getSettings();
  const cc = settings[SETTING.COUNTRY_CODE];

  // Honeypot: a field real patients never fill. Bots happily do.
  if (str(input.trap)) {
    logWarn('submitBooking', 'Honeypot triggered from source=' + str(input.source));
    return { ok: false, error: 'REJECTED' };
  }

  const clinicId = str(input.clinicId);
  const doctorId = str(input.doctorId);
  const reasonId = str(input.reasonId);
  const date = str(input.date);
  const start = str(input.start);
  if (!clinicId || !doctorId || !reasonId || !date || !start) {
    return { ok: false, error: 'MISSING_FIELDS' };
  }
  if (str(input.consent) !== 'true' && str(input.consent) !== '1' && str(input.consent) !== 'on') {
    return { ok: false, error: 'CONSENT_REQUIRED' };
  }

  const name = str(input.name).slice(0, MAX_NAME_LENGTH); // optional by design
  const phoneRaw = str(input.phone).slice(0, 30);
  const phoneConfirm = str(input.phoneConfirm);
  if (!phoneRaw) return { ok: false, error: 'PHONE_REQUIRED' };
  if (phoneConfirm && normalizePhone(phoneRaw, cc) !== normalizePhone(phoneConfirm, cc)) {
    return { ok: false, error: 'PHONE_MISMATCH' };
  }
  if (!isPlausiblePhone(phoneRaw, cc)) return { ok: false, error: 'PHONE_INVALID' };
  const phoneNorm = normalizePhone(phoneRaw, cc);

  const extra = str(input.extra).slice(0, MAX_EXTRA_LENGTH);
  const source = str(input.source).slice(0, 60);

  const req = { clinicId: clinicId, doctorId: doctorId, reasonId: reasonId };

  const lock = LockService.getScriptLock();
  if (!lock.tryLock(20000)) {
    logError('submitBooking', 'Could not get lock');
    return { ok: false, error: 'BUSY' };
  }

  try {
    // Idempotency: a double-tap on an impatient phone must not create two bookings.
    const existing = Db.rows(SHEET.BOOKINGS).filter(function (b) {
      return str(b.status) === STATUS.CONFIRMED &&
        str(b.phone_norm) === phoneNorm &&
        str(b.doctor_id) === doctorId &&
        str(b.date) === date &&
        str(b.start_time) === start;
    });
    if (existing.length) {
      return bookingConfirmation(existing[0], true);
    }

    // Guardrails against a bored teenager with the link.
    const today = todayStr();
    const activeCount = Db.rows(SHEET.BOOKINGS).filter(function (b) {
      return str(b.phone_norm) === phoneNorm &&
        str(b.status) === STATUS.CONFIRMED &&
        str(b.date) >= today;
    }).length;
    if (activeCount >= MAX_FUTURE_BOOKINGS_PER_PHONE) {
      return { ok: false, error: 'TOO_MANY_ACTIVE' };
    }

    const found = findSlot(req, date, start);
    if (!found) return { ok: false, error: 'SLOT_TAKEN' };

    const doctor = Db.findById(SHEET.DOCTORS, 'doctor_id', doctorId) || {};

    const booking = {
      booking_id: bookingRefFor(doctor, date),
      created_at: new Date().toISOString(),
      clinic_id: clinicId,
      doctor_id: doctorId,
      reason_id: reasonId,
      date: date,
      start_time: found.slot.start,
      end_time: found.slot.end,
      name: name,
      phone_raw: phoneRaw,
      phone_norm: phoneNorm,
      email: str(input.email).slice(0, 120),
      extra_json: extra,
      status: STATUS.CONFIRMED,
      status_at: new Date().toISOString(),
      status_by: 'patient',
      rescheduled_from: '',
      staff_note: '',
      wa_sent_at: '',
      wa_template: '',
      event_id: '',
      source: source
    };

    Db.append(SHEET.BOOKINGS, booking);

    const eventId = createEventForBooking(booking);
    if (eventId) {
      Db.update(SHEET.BOOKINGS, 'booking_id', booking.booking_id, { event_id: eventId });
      booking.event_id = eventId;
    }

    logInfo('submitBooking', 'Booked ' + booking.booking_id + ' ' + doctorId + ' ' + date + ' ' + start);
    return bookingConfirmation(booking, false);
  } finally {
    lock.releaseLock();
  }
}

/** Everything the patient (and the staff page) needs to display a finished booking. */
function bookingConfirmation(booking, wasDuplicate) {
  const settings = getSettings();
  const clinic = Db.findById(SHEET.CLINICS, 'clinic_id', str(booking.clinic_id)) || {};
  const doctor = Db.findById(SHEET.DOCTORS, 'doctor_id', str(booking.doctor_id)) || {};
  const reason = Db.findById(SHEET.REASONS, 'reason_id', str(booking.reason_id)) || {};
  const startMin = parseTimeToMin(booking.start_time);
  const links = calendarLinksFor(booking);
  return {
    ok: true,
    duplicate: !!wasDuplicate,
    calendarUrl: links.googleUrl,
    bookingId: str(booking.booking_id),
    name: str(booking.name),
    date: str(booking.date),
    dateAr: formatDateAr(str(booking.date)),
    weekdayAr: weekdayAr(str(booking.date)),
    startTime: str(booking.start_time),
    startTimeAr: startMin === null ? '' : minToTimeAr(startMin),
    endTimeAr: parseTimeToMin(booking.end_time) === null ? '' : minToTimeAr(parseTimeToMin(booking.end_time)),
    doctorAr: str(doctor.name_ar),
    clinicAr: str(clinic.name_ar),
    clinicAddressAr: str(clinic.address_ar),
    clinicPhone: str(clinic.phone),
    // What a patient should actually dial: the branch line when the clinic has filled
    // it in, otherwise the general support number. '' means neither is usable yet.
    contactPhone: callablePhone(clinic.phone) || callablePhone(settings[SETTING.SUPPORT_PHONE]),
    mapLink: str(clinic.map_link),
    reasonAr: str(reason.name_ar),
    whatsappNumber: settings[SETTING.WHATSAPP_NUMBER],
    supportPhone: settings[SETTING.SUPPORT_PHONE],
    successText: settings[SETTING.SUCCESS_TEXT_AR]
  };
}

function getBookingById(bookingId) {
  return Db.findById(SHEET.BOOKINGS, 'booking_id', bookingId);
}

/**
 * Reports.gs — the doctor's data questions, answered from the Bookings sheet.
 *
 * Three outputs:
 *   - buildReportsSheets(): in-spreadsheet report tabs the clinic can pivot themselves
 *   - exportCsv(): a UTF-8 CSV that Excel opens correctly in Arabic
 *   - exportXlsx(): a real .xlsx produced through Drive's export endpoint
 *
 * Every output takes the same filter object and can be narrowed to one doctor, any
 * handful of them (for comparison) or all of them — see doctorIdList().
 */

const REPORT_HEADER_AR = [
  'رقم الحجز', 'تاريخ الحجز', 'الفرع', 'الطبيب', 'سبب الزيارة',
  'تاريخ الموعد', 'اليوم', 'الوقت', 'الاسم', 'الجوال',
  'الحالة', 'آخر تحديث', 'تم التواصل واتساب', 'قالب الرسالة',
  'ملاحظة الطاقم', 'مصدر الحجز'
];

/**
 * The doctor filter, in every shape the callers use:
 *   ''            → all doctors
 *   'D1'          → one doctor
 *   'D1,D2,D3'    → several (what the export URL and the staff panel send)
 *   ['D1','D2']   → the same, from a JSON payload or a test
 * An empty array means "all doctors", never "none" — that is the safer default.
 */
function doctorIdList(value) {
  if (Object.prototype.toString.call(value) === '[object Array]') {
    return value.map(function (v) { return str(v); }).filter(function (v) { return !!v; });
  }
  return str(value).split(',').map(function (v) { return str(v); }).filter(function (v) { return !!v; });
}

/** Read the doctor selection whichever name the caller used. */
function doctorFilterValue(filters) {
  if (!filters) return '';
  return filters.doctorIds !== undefined ? filters.doctorIds : filters.doctorId;
}

function filterBookings(filters) {
  filters = filters || {};
  const from = str(filters.from);
  const to = str(filters.to);
  const doctorIds = doctorIdList(doctorFilterValue(filters));
  const clinicId = str(filters.clinicId);
  const reasonId = str(filters.reasonId);
  const status = str(filters.status);

  return Db.rows(SHEET.BOOKINGS).filter(function (b) {
    const d = str(b.date);
    if (from && d < from) return false;
    if (to && d > to) return false;
    if (doctorIds.length && doctorIds.indexOf(str(b.doctor_id)) === -1) return false;
    if (clinicId && str(b.clinic_id) !== clinicId) return false;
    if (reasonId && str(b.reason_id) !== reasonId) return false;
    if (status && str(b.status) !== status) return false;
    return true;
  }).sort(function (a, b) {
    return (str(a.date) + str(a.start_time)).localeCompare(str(b.date) + str(b.start_time));
  });
}

function reportRows(filters) {
  filters = filters || {};
  const doctorIds = doctorIdList(doctorFilterValue(filters));
  const doctors = indexBy(Db.rows(SHEET.DOCTORS), 'doctor_id');
  const clinics = indexBy(Db.rows(SHEET.CLINICS), 'clinic_id');
  const reasons = indexBy(Db.rows(SHEET.REASONS), 'reason_id');

  const bookings = filterBookings(filters);
  // A file with several doctors in it is a comparison, so group it by doctor instead of
  // interleaving everyone by date. Within one doctor the date order is unchanged.
  if (doctorIds.length > 1) {
    bookings.sort(function (a, b) {
      return (str(a.doctor_id) + str(a.date) + str(a.start_time))
        .localeCompare(str(b.doctor_id) + str(b.date) + str(b.start_time));
    });
  }

  return bookings.map(function (b) {
    const date = str(b.date);
    const startMin = parseTimeToMin(b.start_time);
    return [
      str(b.booking_id),
      str(b.created_at),
      nameOf(clinics, str(b.clinic_id), 'name_ar'),
      nameOf(doctors, str(b.doctor_id), 'name_ar'),
      nameOf(reasons, str(b.reason_id), 'name_ar'),
      date,
      weekdayAr(date),
      startMin === null ? str(b.start_time) : minToTimeAr(startMin),
      str(b.name),
      str(b.phone_norm),
      statusLabelAr(str(b.status)),
      str(b.status_at),
      str(b.wa_sent_at),
      waTemplateLabelAr(b.wa_template),
      str(b.staff_note),
      str(b.source)
    ];
  });
}

function indexBy(rows, field) {
  const out = {};
  rows.forEach(function (r) { out[str(r[field])] = r; });
  return out;
}

function nameOf(index, id, field) {
  return index[id] ? str(index[id][field]) : id;
}

/** The doctors a filter selects, as Arabic names — for a KPI header or a screen label. */
function scopeLabelAr(filters) {
  const ids = doctorIdList(doctorFilterValue(filters));
  if (!ids.length) return 'كل الأطباء';
  const doctors = indexBy(Db.rows(SHEET.DOCTORS), 'doctor_id');
  return ids.map(function (id) { return nameOf(doctors, id, 'name_ar'); }).join(' + ');
}

/** Filesystem-friendly text: no spaces, no characters Windows or Drive dislike. */
function fileSafeAr(text) {
  return str(text).replace(/\s+/g, '-').replace(/[\\\/:*?"<>|]/g, '').replace(/-+/g, '-').slice(0, 60);
}

/** Part of the file name that says who is in the file: one name, a count, or all. */
function exportScopeSlug(filters) {
  const ids = doctorIdList(doctorFilterValue(filters));
  if (!ids.length) return 'كل-الأطباء';
  if (ids.length === 1) {
    const doctors = indexBy(Db.rows(SHEET.DOCTORS), 'doctor_id');
    return fileSafeAr(nameOf(doctors, ids[0], 'name_ar'));
  }
  return 'مقارنة-' + ids.length + '-أطباء';
}

/**
 * 'تقرير-الحجوزات-د.-أحمد-سمير-2026-10-17-1430' (no extension).
 * One place builds the name so every export path — Drive, CSV in the browser, the
 * offline demo — produces a file the clinic can tell apart from the next one.
 */
function exportBaseName(filters, label) {
  const now = new Date();
  const stamp = formatDateStr(now) + '-' + pad2(now.getHours()) + pad2(now.getMinutes());
  return fileSafeAr(label || 'تقرير-الحجوزات') + '-' + exportScopeSlug(filters) + '-' + stamp;
}

/**
 * KPIs the doctor will actually ask about at the end of month one.
 * `extra` accepts the same filters as the exports, so the numbers on screen match the
 * numbers in the file the clinic just downloaded.
 */
function kpiSummary(from, to, extra) {
  extra = extra || {};
  const filters = {
    from: str(from) || str(extra.from),
    to: str(to) || str(extra.to),
    doctorId: extra.doctorId,
    doctorIds: extra.doctorIds,
    clinicId: extra.clinicId,
    reasonId: extra.reasonId,
    status: extra.status
  };
  const rows = filterBookings(filters);
  const started = rows.filter(function (r) { return OCCUPYING_STATUSES.indexOf(str(r.status)) !== -1; });
  const attended = rows.filter(function (r) { return str(r.status) === STATUS.ATTENDED; });
  const noShow = rows.filter(function (r) { return str(r.status) === STATUS.NO_SHOW; });
  const cancelled = rows.filter(function (r) { return str(r.status) === STATUS.CANCELLED; });
  const rescheduled = rows.filter(function (r) { return str(r.status) === STATUS.RESCHEDULED; });

  const finished = attended.length + noShow.length;
  const phoneCounts = {};
  rows.forEach(function (r) {
    const p = str(r.phone_norm);
    if (!p) return;
    phoneCounts[p] = (phoneCounts[p] || 0) + 1;
  });
  const phones = Object.keys(phoneCounts);
  const repeat = phones.filter(function (p) { return phoneCounts[p] > 1; }).length;

  return {
    from: filters.from, to: filters.to,
    scopeLabelAr: scopeLabelAr(filters),
    doctorIds: doctorIdList(doctorFilterValue(filters)),
    totalBookings: rows.length,
    activeBookings: started.length,
    attended: attended.length,
    noShow: noShow.length,
    cancelled: cancelled.length,
    rescheduled: rescheduled.length,
    noShowRate: finished ? Math.round((noShow.length / finished) * 1000) / 10 : 0,
    uniquePatients: phones.length,
    repeatPatients: repeat,
    repeatRate: phones.length ? Math.round((repeat / phones.length) * 1000) / 10 : 0,
    byDoctor: groupCount(rows, 'doctor_id', 'name_ar', 'doctor_id'),
    byClinic: groupCount(rows, 'clinic_id', 'name_ar', 'clinic_id'),
    byReason: groupCount(rows, 'reason_id', 'name_ar', 'reason_id'),
    byHour: hourHistogram(rows),
    topPatients: topPatients(phoneCounts, rows)
  };
}

function groupCount(rows, idField, labelField, sourceSheetIdField) {
  const labels = {};
  const sheet = sourceSheetIdField === 'doctor_id' ? SHEET.DOCTORS
    : sourceSheetIdField === 'clinic_id' ? SHEET.CLINICS : SHEET.REASONS;
  const idFieldInSheet = sourceSheetIdField;
  Db.rows(sheet).forEach(function (r) { labels[str(r[idFieldInSheet])] = str(r[labelField]); });

  const counts = {};
  rows.forEach(function (r) {
    const k = str(r[idField]);
    counts[k] = (counts[k] || 0) + 1;
  });
  return Object.keys(counts).map(function (k) {
    return { id: k, labelAr: labels[k] || k, count: counts[k] };
  }).sort(function (a, b) { return b.count - a.count; });
}

function hourHistogram(rows) {
  const counts = {};
  rows.forEach(function (r) {
    const min = parseTimeToMin(r.start_time);
    if (min === null) return;
    const hour = Math.floor(min / 60);
    counts[hour] = (counts[hour] || 0) + 1;
  });
  return Object.keys(counts).map(function (h) {
    return { hour: Number(h), labelAr: minToTimeAr(Number(h) * 60), count: counts[h] };
  }).sort(function (a, b) { return a.hour - b.hour; });
}

function topPatients(phoneCounts, rows) {
  const names = {};
  rows.forEach(function (r) {
    const p = str(r.phone_norm);
    if (p && str(r.name) && !names[p]) names[p] = str(r.name);
  });
  return Object.keys(phoneCounts).map(function (p) {
    return { phone: p, name: names[p] || '', count: phoneCounts[p] };
  }).sort(function (a, b) { return b.count - a.count; }).slice(0, 20);
}

/** Rebuild the in-spreadsheet report tabs. Called from the menu. */
function buildReportsSheets() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const data = reportRows({});
  writeTab(ss, 'Report_Data', REPORT_HEADER_AR, data);

  const kpi = kpiSummary('', '');
  const kpiRows = [
    ['الفترة', (kpi.from || 'البداية') + ' → ' + (kpi.to || 'النهاية')],
    ['النطاق', kpi.scopeLabelAr],
    ['إجمالي الحجوزات', kpi.totalBookings],
    ['حجوزات قائمة', kpi.activeBookings],
    ['حضر', kpi.attended],
    ['لم يحضر', kpi.noShow],
    ['ملغي', kpi.cancelled],
    ['تم تغييره', kpi.rescheduled],
    ['نسبة عدم الحضور %', kpi.noShowRate],
    ['مرضى مختلفون', kpi.uniquePatients],
    ['مرضى مكررون', kpi.repeatPatients],
    ['نسبة التكرار %', kpi.repeatRate],
    ['', ''],
    ['الطبيب', 'عدد الحجوزات']
  ].concat(kpi.byDoctor.map(function (d) { return [d.labelAr, d.count]; }))
    .concat([['', ''], ['الفرع', 'عدد الحجوزات']])
    .concat(kpi.byClinic.map(function (d) { return [d.labelAr, d.count]; }))
    .concat([['', ''], ['سبب الزيارة', 'عدد الحجوزات']])
    .concat(kpi.byReason.map(function (d) { return [d.labelAr, d.count]; }))
    .concat([['', ''], ['الساعة', 'عدد الحجوزات']])
    .concat(kpi.byHour.map(function (h) { return [h.labelAr, h.count]; }));

  writeTab(ss, 'Report_KPIs', ['البند', 'القيمة'], kpiRows);
  logInfo('buildReportsSheets', 'Rebuilt report tabs with ' + data.length + ' rows');
  return { ok: true, rows: data.length, kpis: kpi };
}

function writeTab(ss, name, header, rows) {
  let sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  sh.clear();
  sh.getRange(1, 1, 1, header.length).setValues([header]).setFontWeight('bold');
  sh.setFrozenRows(1);
  if (rows.length) {
    sh.getRange(2, 1, rows.length, header.length).setValues(rows);
    sh.autoResizeColumns(1, header.length);
  }
  return sh;
}

function exportCsv(filters) {
  const rows = reportRows(filters);
  return csvFromRows(REPORT_HEADER_AR, rows);
}

/**
 * A genuine .xlsx, via the temp-sheet + Drive export trick. Returns a Drive link
 * because ContentService cannot stream binary downloads. `label` overrides the
 * leading part of the file name (the nightly backup does); the selected doctors and
 * the timestamp are always appended, so two exports never collide.
 */
function exportXlsx(filters, label) {
  const rows = reportRows(filters);
  const name = exportBaseName(filters, label);

  const temp = SpreadsheetApp.create(name + ' (temp)');
  const header = REPORT_HEADER_AR;
  const sh = temp.getSheets()[0];
  sh.setName('Bookings');
  sh.getRange(1, 1, 1, header.length).setValues([header]).setFontWeight('bold');
  if (rows.length) sh.getRange(2, 1, rows.length, header.length).setValues(rows);

  let link = '';
  try {
    const url = 'https://www.googleapis.com/drive/v3/files/' + temp.getId() +
      '/export?mimeType=' + encodeURIComponent('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') +
      '&alt=media';
    const response = UrlFetchApp.fetch(url, {
      headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() },
      muteHttpExceptions: true
    });
    const blob = response.getBlob().setName(name + '.xlsx');
    const folderId = str(getSettings()[SETTING.BACKUP_FOLDER_ID]);
    const file = folderId
      ? DriveApp.getFolderById(folderId).createFile(blob)
      : DriveApp.createFile(blob);
    link = file.getUrl();
  } catch (err) {
    logError('exportXlsx', 'Drive export failed, falling back to a Google Sheet: ' + err);
    link = temp.getUrl();
  }

  try {
    DriveApp.getFileById(temp.getId()).setTrashed(true);
  } catch (err) {
    logWarn('exportXlsx', 'Could not trash the temp sheet: ' + err);
  }

  logInfo('exportXlsx', 'Exported ' + rows.length + ' rows to ' + link);
  return { ok: true, rows: rows.length, url: link, fileName: name + '.xlsx' };
}

/**
 * StaffApi.gs — the reception desk.
 *
 * Every function here requires the staff code from Settings. The web app is
 * deployed anonymously so patients can book without accounts, which also means
 * these functions are reachable by anyone who knows the URL. The code is the
 * only gate, so it must be changed at setup and treated as a password.
 */

function assertStaff(code) {
  const expected = str(getSettings()[SETTING.STAFF_CODE]);
  const given = str(code);
  if (!expected || given !== expected) {
    logWarn('assertStaff', 'Rejected staff call with a wrong code');
    return false;
  }
  return true;
}

function staffError(message) {
  return { ok: false, error: 'STAFF_CODE', messageAr: message };
}

/** One day's agenda, ready to render: no formatting work left for the browser. */
function getStaffBoard(dateStr, code) {
  if (!assertStaff(code)) return staffError(errorMessageAr('STAFF_CODE'));
  const date = str(dateStr) || todayStr();
  const bookings = Db.rows(SHEET.BOOKINGS)
    .filter(function (b) { return str(b.date) === date; })
    .sort(function (a, b) { return str(a.start_time).localeCompare(str(b.start_time)); })
    .map(function (b) { return boardItem(b); });

  const counts = { total: bookings.length, confirmed: 0, attended: 0, no_show: 0, cancelled: 0, reminded: 0 };
  bookings.forEach(function (b) {
    if (b.status === STATUS.CONFIRMED) counts.confirmed++;
    if (b.status === STATUS.ATTENDED) counts.attended++;
    if (b.status === STATUS.NO_SHOW) counts.no_show++;
    if (b.status === STATUS.CANCELLED || b.status === STATUS.RESCHEDULED) counts.cancelled++;
    if (b.waSentAt) counts.reminded++;
  });

  const upcoming = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDaysStr(todayStr(), i);
    const n = Db.rows(SHEET.BOOKINGS).filter(function (b) {
      return str(b.date) === d &&
        OCCUPYING_STATUSES.indexOf(str(b.status)) !== -1;
    }).length;
    upcoming.push({ date: d, labelAr: formatDateAr(d), count: n });
  }

  return {
    ok: true,
    date: date,
    dateAr: formatDateAr(date),
    weekdayAr: weekdayAr(date),
    bookings: bookings,
    doctors: dayDoctors(date),
    counts: counts,
    upcoming: upcoming
  };
}

/**
 * Who is on duty this day, and when — the labels the reception filters the shared
 * schedule by, plus the columns it draws. A doctor appears if they work that weekday
 * or already have a booking then (even a cancelled one, so nothing goes missing).
 */
function dayDoctors(date) {
  const wd = weekdayIndex(date);
  const availability = Db.rows(SHEET.AVAILABILITY).filter(isActive);
  const bookings = Db.rows(SHEET.BOOKINGS).filter(function (b) { return str(b.date) === date; });

  const out = [];
  Db.rows(SHEET.DOCTORS).forEach(function (d) {
    const doctorId = str(d.doctor_id);
    const dayBookings = bookings.filter(function (b) { return str(b.doctor_id) === doctorId; });
    const windows = availability.filter(function (a) {
      return str(a.doctor_id) === doctorId && Number(a.weekday) === wd && withinValidRange(a, date);
    }).map(function (a) {
      const from = parseTimeToMin(a.from_time);
      const to = parseTimeToMin(a.to_time);
      const reason = Db.findById(SHEET.REASONS, 'reason_id', str(a.reason_id)) || {};
      const clinic = Db.findById(SHEET.CLINICS, 'clinic_id', str(a.clinic_id)) || {};
      return {
        fromAr: from === null ? '' : minToTimeAr(from),
        toAr: to === null ? '' : minToTimeAr(to),
        reasonAr: str(reason.name_ar),
        clinicAr: str(clinic.name_ar)
      };
    });

    if (!windows.length && !dayBookings.length) return;
    if (!isActive(d) && !dayBookings.length) return;

    const times = dayBookings.map(function (b) { return str(b.start_time); }).filter(Boolean).sort();
    const labels = [];
    windows.forEach(function (w) {
      const label = w.fromAr + ' – ' + w.toAr;
      if (labels.indexOf(label) === -1) labels.push(label);
    });

    out.push({
      id: doctorId,
      nameAr: str(d.name_ar),
      specialtyAr: str(d.specialty_ar),
      code: doctorCode(d),
      color: doctorColorHex(d.color),
      active: isActive(d),
      windows: windows,
      windowsAr: labels.join(' / '),
      bookings: dayBookings.length,
      confirmed: dayBookings.filter(function (b) { return str(b.status) === STATUS.CONFIRMED; }).length,
      firstTime: times.length ? times[0] : ''
    });
  });

  // Earliest appointment first (doctors with no bookings last), then by name.
  out.sort(function (a, b) {
    const at = a.firstTime || '99:99';
    const bt = b.firstTime || '99:99';
    if (at !== bt) return at < bt ? -1 : 1;
    return a.nameAr.localeCompare(b.nameAr);
  });
  return out;
}

function boardItem(b) {
  const doctor = Db.findById(SHEET.DOCTORS, 'doctor_id', str(b.doctor_id)) || {};
  const clinic = Db.findById(SHEET.CLINICS, 'clinic_id', str(b.clinic_id)) || {};
  const reason = Db.findById(SHEET.REASONS, 'reason_id', str(b.reason_id)) || {};
  const startMin = parseTimeToMin(b.start_time);
  return {
    bookingId: str(b.booking_id),
    name: str(b.name),
    phoneNorm: str(b.phone_norm),
    phoneRaw: str(b.phone_raw),
    time: str(b.start_time),
    timeAr: startMin === null ? '' : minToTimeAr(startMin),
    doctorId: str(b.doctor_id),
    doctorAr: str(doctor.name_ar),
    doctorColor: doctorColorHex(doctor.color),
    doctorCode: doctorCode(doctor),
    clinicId: str(b.clinic_id),
    clinicAr: str(clinic.name_ar),
    reasonId: str(b.reason_id),
    reasonAr: str(reason.name_ar),
    status: str(b.status),
    staffNote: str(b.staff_note),
    waSentAt: str(b.wa_sent_at),
    waTemplate: waTemplateLabelAr(b.wa_template),
    rescheduledFrom: str(b.rescheduled_from),
    source: str(b.source),

  };

/** attended / no_show / cancelled. Cancelling frees the slot and drops the calendar event. */
function setBookingStatus(bookingId, status, code, note) {
  if (!assertStaff(code)) return staffError(errorMessageAr('STAFF_CODE'));
  const next = str(status);
  if (STAFF_STATUS_CHOICES.indexOf(next) === -1) {
    return { ok: false, error: 'BAD_STATUS', messageAr: 'حالة غير معروفة.' };
  }
  const booking = Db.findById(SHEET.BOOKINGS, 'booking_id', str(bookingId));
  if (!booking) return { ok: false, error: 'NOT_FOUND', messageAr: errorMessageAr('NOT_FOUND') };
  if (str(booking.status) === STATUS.RESCHEDULED) {
    return { ok: false, error: 'ALREADY_RESCHEDULED', messageAr: 'هذا الموعد تم تغييره بالفعل.' };
  }

  Db.update(SHEET.BOOKINGS, 'booking_id', str(bookingId), {
    status: next,
    status_at: new Date().toISOString(),
    status_by: 'staff',
    staff_note: note === undefined ? str(booking.staff_note) : str(note)
  });

  if (next === STATUS.CANCELLED) {
    deleteEventForBooking(booking);
    Db.update(SHEET.BOOKINGS, 'booking_id', str(bookingId), { event_id: '' });
  } else if (next === STATUS.NO_SHOW) {
    annotateEvent(booking, '✗ لم يحضر');
  } else if (next === STATUS.ATTENDED) {
    annotateEvent(booking, '✓ حضر');
  }

  logInfo('setBookingStatus', str(bookingId) + ' -> ' + next);
  return { ok: true, bookingId: str(bookingId), status: next };
}

/**
 * Reschedule = close the old row, open a new one, keep one calendar event.
 * Nothing is deleted, so "she moved twice" stays visible in history.
 */
function rescheduleBooking(bookingId, newDate, newStart, code, note) {
  if (!assertStaff(code)) return staffError(errorMessageAr('STAFF_CODE'));
  const booking = Db.findById(SHEET.BOOKINGS, 'booking_id', str(bookingId));
  if (!booking) return { ok: false, error: 'NOT_FOUND', messageAr: errorMessageAr('NOT_FOUND') };
  if (str(booking.status) !== STATUS.CONFIRMED) {
    return { ok: false, error: 'NOT_CONFIRMED', messageAr: 'لا يمكن تغيير موعد غير مؤكد.' };
  }

  const req = {
    clinicId: str(booking.clinic_id),
    doctorId: str(booking.doctor_id),
    reasonId: str(booking.reason_id)
  };
  const found = findSlot(req, str(newDate), str(newStart));
  if (!found) return { ok: false, error: 'SLOT_TAKEN', messageAr: errorMessageAr('SLOT_TAKEN') };

  const now = new Date().toISOString();
  const fresh = {
    booking_id: bookingRefFor(Db.findById(SHEET.DOCTORS, 'doctor_id', str(booking.doctor_id)) || {}, str(newDate)),
    created_at: now,
    clinic_id: str(booking.clinic_id),
    doctor_id: str(booking.doctor_id),
    reason_id: str(booking.reason_id),
    date: str(newDate),
    start_time: found.slot.start,
    end_time: found.slot.end,
    name: str(booking.name),
    phone_raw: str(booking.phone_raw),
    phone_norm: str(booking.phone_norm),
    email: str(booking.email),
    extra_json: str(booking.extra_json),
    status: STATUS.CONFIRMED,
    status_at: now,
    status_by: 'staff',
    rescheduled_from: str(bookingId),
    staff_note: str(note),
    wa_sent_at: '',
    wa_template: '',
    event_id: str(booking.event_id),
    source: 'staff:reschedule'
  };

  Db.append(SHEET.BOOKINGS, fresh);

  if (fresh.event_id) {
    const moved = moveEventForBooking(fresh);
    if (!moved) {
      deleteEventForBooking(booking);
      const newEventId = createEventForBooking(fresh);
      Db.update(SHEET.BOOKINGS, 'booking_id', fresh.booking_id, { event_id: newEventId });
      fresh.event_id = newEventId;
    }
  } else {
    const newEventId = createEventForBooking(fresh);
    Db.update(SHEET.BOOKINGS, 'booking_id', fresh.booking_id, { event_id: newEventId });
    fresh.event_id = newEventId;
  }

  Db.update(SHEET.BOOKINGS, 'booking_id', str(bookingId), {
    status: STATUS.RESCHEDULED,
    status_at: now,
    status_by: 'staff',
    event_id: '',
    staff_note: str(note)
  });

  logInfo('rescheduleBooking', str(bookingId) + ' -> ' + fresh.booking_id + ' ' + newDate + ' ' + newStart);
  return { ok: true, oldBookingId: str(bookingId), booking: bookingConfirmation(fresh, false) };
}

/** Block a doctor's or a clinic's time, from the staff page. Also mirrored to the calendar. */
function blockTime(payload, code) {
  if (!assertStaff(code)) return staffError(errorMessageAr('STAFF_CODE'));
  payload = payload || {};
  const date = str(payload.date);
  if (!date) return { ok: false, error: 'MISSING_FIELDS', messageAr: 'اختر التاريخ.' };
  const scopeType = str(payload.scopeType) || 'all';
  const scopeId = str(payload.scopeId);
  const fromTime = str(payload.fromTime);
  const toTime = str(payload.toTime);
  const note = str(payload.note);
  const blackoutId = newId('BLK');

  Db.append(SHEET.BLACKOUTS, {
    blackout_id: blackoutId,
    date: date,
    scope_type: scopeType,
    scope_id: scopeId,
    from_time: fromTime,
    to_time: toTime,
    note: note || 'إيقاف من شاشة الاستقبال'
  });

  // Mirror to the calendar so the doctors can see the block where they look.
  try {
    const cal = ensureSharedCalendar();
    const from = parseDateTime(date, fromTime || '00:00');
    const to = parseDateTime(date, toTime || '23:59');
    cal.createEvent(BLOCK_PREFIX + (scopeType !== 'all' ? ' [' + scopeType + ':' + scopeId + '] ' : ' ') + (note || ''), from, to);
  } catch (err) {
    logWarn('blockTime', 'Calendar mirror failed: ' + err);
  }

  return { ok: true, blackoutId: blackoutId };
}

function parseDateTime(dateStr, timeStr) {
  const d = parseDateStr(dateStr);
  const min = parseTimeToMin(timeStr);
  const m = min === null ? 0 : min;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(m / 60), m % 60);
}

/** Patient history by phone — the report the doctor described, for one person. */
function lookupPatient(phone, code) {
  if (!assertStaff(code)) return staffError(errorMessageAr('STAFF_CODE'));
  const cc = getSettings()[SETTING.COUNTRY_CODE];
  const norm = normalizePhone(phone, cc);
  if (!norm) return { ok: false, error: 'NOT_FOUND', messageAr: errorMessageAr('NOT_FOUND') };

  const rows = Db.rows(SHEET.BOOKINGS)
    .filter(function (b) { return str(b.phone_norm) === norm; })
    .sort(function (a, b) { return str(b.date).localeCompare(str(a.date)); });

  if (!rows.length) return { ok: false, error: 'NOT_FOUND', messageAr: 'لا يوجد سجل بهذا الرقم.' };

  const items = rows.map(function (b) {
    const doctor = Db.findById(SHEET.DOCTORS, 'doctor_id', str(b.doctor_id)) || {};
    const clinic = Db.findById(SHEET.CLINICS, 'clinic_id', str(b.clinic_id)) || {};
    const reason = Db.findById(SHEET.REASONS, 'reason_id', str(b.reason_id)) || {};
    return {
      bookingId: str(b.booking_id),
      dateAr: formatDateAr(str(b.date)),
      date: str(b.date),
      timeAr: timeToAr(b.start_time),
      doctorAr: str(doctor.name_ar),
      clinicAr: str(clinic.name_ar),
      reasonAr: str(reason.name_ar),
      status: str(b.status),
      statusAr: statusLabelAr(str(b.status))
    };
  });

  return {
    ok: true,
    phoneNorm: norm,
    name: str(rows[0].name),
    total: items.length,
    attended: items.filter(function (i) { return i.status === STATUS.ATTENDED; }).length,
    noShow: items.filter(function (i) { return i.status === STATUS.NO_SHOW; }).length,
    items: items
  };
}

function statusLabelAr(status) {
  const map = {};
  map[STATUS.CONFIRMED] = 'مؤكد';
  map[STATUS.ATTENDED] = 'حضر';
  map[STATUS.NO_SHOW] = 'لم يحضر';
  map[STATUS.CANCELLED] = 'ملغي';
  map[STATUS.RESCHEDULED] = 'تم تغييره';
  return map[str(status)] || str(status);
}

/**
 * Notify.gs — internal mail only.
 *
 * Nothing here is sent to patients: reminders reach patients as manual WhatsApp
 * messages from the staff page. These jobs go to the clinic's own inbox.
 *
 * Consumer Gmail allows 100 recipients/day through Apps Script. One clinic
 * inbox receives ~2 mails a day from this file, so the quota is irrelevant.
 */

function looksLikeRealEmail(value) {
  const v = str(value);
  return v.indexOf('@') > 0 && v.indexOf('[') === -1;
}

/** Morning agenda for reception: who is coming today, and who still needs a reminder. */
function sendDailyAgenda(dateStr) {
  const settings = getSettings();
  const to = str(settings[SETTING.REPORT_EMAIL]);
  if (!looksLikeRealEmail(to)) {
    logWarn('sendDailyAgenda', 'report_email is not set; skipping');
    return { ok: false, error: 'NO_RECIPIENT' };
  }

  const day = str(dateStr) || todayStr();
  const board = getStaffBoard(day, str(settings[SETTING.STAFF_CODE]));
  if (!board.ok) return board;

  const rows = board.bookings.map(function (b) {
    const flag = b.status === STATUS.CONFIRMED && !b.waSentAt ? ' ⚠️ لم يتم التذكير' : '';
    return '<tr>' +
      '<td>' + escapeHtml(b.timeAr) + '</td>' +
      '<td>' + escapeHtml(b.doctorAr) + '</td>' +
      '<td>' + escapeHtml(b.reasonAr) + '</td>' +
      '<td>' + escapeHtml(b.name || '—') + '</td>' +
      '<td dir="ltr">' + escapeHtml(b.phoneNorm) + '</td>' +
      '<td>' + escapeHtml(statusLabelAr(b.status)) + flag + '</td>' +
      '</tr>';
  }).join('');

  const html = '<div dir="rtl" style="font-family:system-ui,Segoe UI,Arial;direction:rtl">' +
    '<h2>مواعيد ' + escapeHtml(board.dateAr) + ' — ' + escapeHtml(str(settings[SETTING.CLINIC_NAME])) + '</h2>' +
    '<p>إجمالي: ' + board.counts.total + ' | مؤكد: ' + board.counts.confirmed +
    ' | حضر: ' + board.counts.attended + ' | لم يحضر: ' + board.counts.no_show +
    ' | ملغي: ' + board.counts.cancelled + '</p>' +
    (rows
      ? '<table cellpadding="6" cellspacing="0" border="1" style="border-collapse:collapse;font-size:14px">' +
        '<thead style="background:#eee"><tr><th>الوقت</th><th>الطبيب</th><th>سبب الزيارة</th><th>الاسم</th><th>الجوال</th><th>الحالة</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>'
      : '<p>لا توجد مواعيد في هذا اليوم.</p>') +
    '<p style="color:#666;font-size:12px">تذكيرات المرضى تُرسل يدوياً من شاشة الاستقبال.</p>' +
    '</div>';

  MailApp.sendEmail({
    to: to,
    subject: 'مواعيد اليوم ' + board.dateAr + ' (' + board.counts.total + ')',
    htmlBody: html
  });
  logInfo('sendDailyAgenda', 'Agenda sent for ' + day + ' (' + board.counts.total + ' bookings)');
  return { ok: true, sent: to, total: board.counts.total };
}

    'نسبة عدم الحضور: ' + kpi.noShowRate + '%',
    'مرضى مختلفون: ' + kpi.uniquePatients + ' | مكررون: ' + kpi.repeatPatients,
    '',
    'الأطباء:',
  ].concat(kpi.byDoctor.map(function (d) { return '  - ' + d.labelAr + ': ' + d.count; }))
    .concat(['', 'الأسباب:'])
    .concat(kpi.byReason.map(function (d) { return '  - ' + d.labelAr + ': ' + d.count; }));

  if (looksLikeRealEmail(to)) {
    MailApp.sendEmail({
      to: to,
      subject: 'نسخة احتياطية أسبوعية — ' + str(settings[SETTING.CLINIC_NAME]),
      body: 'ملف الإكسل:\n' + exported.url + '\n\n' + lines.join('\n')
    });
  } else {
    logWarn('sendWeeklyBackup', 'report_email is not set; backup file only');
  }

  // Keep a rolling master copy in Drive as well, in case the sheet itself is lost.
  try {
    const folderId = str(settings[SETTING.BACKUP_FOLDER_ID]);
    if (folderId) {
      const master = 'PolyClinic-MASTER-' + formatDateStr(new Date());
      const already = DriveApp.getFolderById(folderId).getFilesByName(master).hasNext();
      if (!already) {
        DriveApp.getFileById(SpreadsheetApp.getActiveSpreadsheet().getId())
          .makeCopy(master, DriveApp.getFolderById(folderId));
      }
    }
  } catch (err) {
    logWarn('sendWeeklyBackup', 'Master copy failed: ' + err);
  }

  logInfo('sendWeeklyBackup', 'Backup done: ' + exported.url);
  return { ok: true, url: exported.url, emailed: looksLikeRealEmail(to), kpi: kpi };
}

/**
 * Creates any missing sheet, writes its header row, and forces plain-text
 * formatting so 'yyyy-MM-dd' and 'HH:mm' can never be reinterpreted by Sheets.
 */
function createAllSheets() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const created = [];
  Object.keys(HEADERS).forEach(function (name) {
    let sh = ss.getSheetByName(name);
    if (!sh) {
      sh = ss.insertSheet(name);
      created.push(name);
    }
    const header = HEADERS[name];
    const current = sh.getLastRow() >= 1 && sh.getLastColumn() >= 1
      ? sh.getRange(1, 1, 1, Math.max(sh.getLastColumn(), 1)).getValues()[0].map(String)
      : [];
    const matches = current.length === header.length && header.every(function (h, i) { return current[i] === h; });
    if (!matches) {
      sh.getRange(1, 1, 1, header.length).setValues([header]);
    }
    sh.getRange(1, 1, 1, header.length).setFontWeight('bold');
    sh.getRange(1, 1, Math.max(sh.getMaxRows(), 2), header.length).setNumberFormat('@');
    sh.setFrozenRows(1);
    if (name !== SHEET.SETTINGS) sh.setColumnWidth(1, 150);
  });
  invalidateSettingsCache();
  logInfo('createAllSheets', 'Created: ' + (created.join(', ') || 'none') + ' | verified: ' + Object.keys(HEADERS).length);
  return { ok: true, created: created };
}

/** Creates the shared calendar and the backup folder if they do not exist yet. */
function ensureCalendarAndFolder() {
  const settings = getSettings();
  const cal = ensureSharedCalendar();

  let folderId = str(settings[SETTING.BACKUP_FOLDER_ID]);
  if (!folderId) {
    const folder = DriveApp.createFolder('PolyClinic Backups — ' + str(settings[SETTING.CLINIC_NAME]));
    folderId = folder.getId();
    setSetting(SETTING.BACKUP_FOLDER_ID, folderId);
  }

  // Safety net: the clinic account is a single point of failure. A weekly copy
  // of the whole spreadsheet lives in Drive regardless of what happens to it.
  try {
    const folder = DriveApp.getFolderById(folderId);
    const files = folder.getFilesByName('PolyClinic-MASTER-backup');
    if (!files.hasNext()) {
      DriveApp.getFileById(SpreadsheetApp.getActiveSpreadsheet().getId()).makeCopy('PolyClinic-MASTER-backup', folder);
    }
  } catch (err) {
    logWarn('ensureCalendarAndFolder', 'Initial master backup failed: ' + err);
  }

  return { ok: true, calendarId: cal.getId(), calendarName: cal.getName(), backupFolderId: folderId };
}

/** Runs on a schedule (see installTriggers). */
function installTriggers() {
  const handlers = ['jobDailyAgenda', 'jobSyncBlocks', 'jobWeeklyBackup'];
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (handlers.indexOf(t.getHandlerFunction()) !== -1) ScriptApp.deleteTrigger(t);
  });

  ScriptApp.newTrigger('jobDailyAgenda').timeBased().atHour(7).everyDays(1).create();
  ScriptApp.newTrigger('jobSyncBlocks').timeBased().atHour(5).everyDays(1).create();
  ScriptApp.newTrigger('jobWeeklyBackup').timeBased().onWeekDay(ScriptApp.WeekDay.SUNDAY).atHour(22).create();

  logInfo('installTriggers', 'Installed daily agenda, nightly block sync, weekly backup');
  return { ok: true, triggers: ScriptApp.getProjectTriggers().length };
}

function removeTriggers() {
  ScriptApp.getProjectTriggers().forEach(function (t) { ScriptApp.deleteTrigger(t); });
  return { ok: true };
}

/** What is still a placeholder, what is missing, what looks broken. */
function checkConfiguration() {
  const warnings = [];
  const settings = getSettings();

  Db.rows(SHEET.CLINICS).forEach(function (c) {
    if (str(c.name_ar).indexOf('[') !== -1) warnings.push('الفرع ' + str(c.clinic_id) + ': الاسم لم يُعدّل بعد (' + str(c.name_ar) + ')');
  });
  Db.rows(SHEET.DOCTORS).forEach(function (d) {
    if (str(d.name_ar).indexOf('[') !== -1) warnings.push('الطبيب ' + str(d.doctor_id) + ': الاسم لم يُعدّل بعد (' + str(d.name_ar) + ')');
  });
  if (str(settings[SETTING.STAFF_CODE]) === SETTING_DEFAULTS[SETTING.STAFF_CODE]) {
    warnings.push('كود الاستقبال ما زال الافتراضي — غيّره فوراً.');
  }
  if (!str(settings[SETTING.REPORT_EMAIL]).match(/@/)) {
    warnings.push('بريد التقارير غير مضبوط، لن تصل النسخ الاحتياطية.');
  }
  if (!Db.rows(SHEET.AVAILABILITY).filter(isActive).length) {
    warnings.push('لا توجد أي مواعيد متاحة — المرضى لن يجدوا أي وقت.');
  }

  const doctorIds = {};
  Db.rows(SHEET.DOCTORS).forEach(function (d) { doctorIds[str(d.doctor_id)] = true; });
  const clinicIds = {};
  Db.rows(SHEET.CLINICS).forEach(function (c) { clinicIds[str(c.clinic_id)] = true; });
  const reasonIds = {};
  Db.rows(SHEET.REASONS).forEach(function (r) { reasonIds[str(r.reason_id)] = true; });
  Db.rows(SHEET.AVAILABILITY).forEach(function (a) {
    if (!doctorIds[str(a.doctor_id)]) warnings.push('Availability ' + str(a.availability_id) + ': طبيب غير موجود (' + str(a.doctor_id) + ')');
    if (!clinicIds[str(a.clinic_id)]) warnings.push('Availability ' + str(a.availability_id) + ': فرع غير موجود (' + str(a.clinic_id) + ')');
    if (!reasonIds[str(a.reason_id)]) warnings.push('Availability ' + str(a.availability_id) + ': سبب زيارة غير موجود (' + str(a.reason_id) + ')');
    if (parseTimeToMin(a.from_time) === null || parseTimeToMin(a.to_time) === null) {
      warnings.push('Availability ' + str(a.availability_id) + ': وقت غير صالح، يجب أن يكون HH:mm');
    }
  });

  // Two doctors with the same code would produce the same booking reference,
  // which defeats the point of reading it back over the phone.
  const codeOwner = {};
  Db.rows(SHEET.DOCTORS).filter(isActive).forEach(function (d) {
    const code = doctorCode(d);
    if (codeOwner[code]) {
      warnings.push('الطبيب ' + str(d.doctor_id) + ': كود الحجز "' + code + '" مستخدم أيضاً للطبيب ' + codeOwner[code] +
        ' — اكتب كوداً مختلفاً (حرفان لاتينيان) في عمود code بورقة Doctors.');
    } else {
      codeOwner[code] = str(d.doctor_id);
    }
  });

  const result = { ok: warnings.length === 0, warnings: warnings, bookingUrl: getBookingUrl() };
  Logger.log(JSON.stringify(result, null, 2));
  return result;
}

/**

 *
 * Two pages and one export route:
 *   /exec                      → the public booking page (what patients see)
 *   /exec?page=staff           → the reception screen (asks for the staff code)
 *   /exec?page=export&type=... → CSV / XLSX download (needs the staff code)

function doGet(e) {
  const params = (e && e.parameter) || {};
  const page = str(params.page);

  if (page === 'export') return handleExport(params);
  if (page === 'staff') return renderStaffPage(params);
  return renderBookingPage(params);

function renderBookingPage(params) {

  t.preset = {
    clinicId: str(params.clinic),
    doctorId: str(params.doctor),
    reasonId: str(params.reason)

  return t.evaluate()
    .setTitle(getPublicConfig().clinicName + ' — حجز موعد')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */

function handleExport(params) {
  const code = str(params.code);
  if (!assertStaff(code)) {
    return HtmlService.createHtmlOutput(
      '<div dir="rtl" style="font-family:Arial;padding:24px">كود الاستقبال غير صحيح.</div>'
    );
  }

  // `doctor` takes '' (every doctor), one id, or a comma-separated list for a
  // comparison export — the same shape filterBookings understands.
  const filters = {
    from: str(params.from),
    to: str(params.to),
    doctorId: str(params.doctor),
    clinicId: str(params.clinic),
    reasonId: str(params.reason),
    status: str(params.status)
  };
  const type = str(params.type) || 'xlsx';

  if (type === 'csv') {
    const csv = exportCsv(filters);
    return ContentService.createTextOutput(csv).setMimeType(ContentService.MimeType.CSV);
  }

  const result = exportXlsx(filters);
  const safeUrl = escapeHtml(result.url);
  return HtmlService.createHtmlOutput(
    '<div dir="rtl" style="font-family:Arial;padding:24px">' +
    '<meta http-equiv="refresh" content="0;url=' + safeUrl + '">' +
    '<p>تم إنشاء التقرير (' + result.rows + ' صف).</p>' +
    '<p><a href="' + safeUrl + '" target="_blank" style="font-size:18px">اضغط هنا للتحميل</a></p>' +
    '</div>'
  );
}

      getBootstrap: getBootstrap,
      submitBooking: submitBooking,
      getStaffBoard: getStaffBoard,
      setBookingStatus: setBookingStatus,
      rescheduleBooking: rescheduleBooking,
      blockTime: blockTime,
      lookupPatient: lookupPatient,
      getStaffSlots: getStaffSlots,
      getStaffCatalog: getStaffCatalog,
      markWhatsAppSent: markWhatsAppSent,
      kpiSummary: kpiSummary,
      reportRows: reportRows,
      filterBookings: filterBookings,
      exportCsv: exportCsv,
      // Naming and scope: the same functions the live export uses, so an offline demo
      // file and a live Drive file are named identically.
      REPORT_HEADER_AR: REPORT_HEADER_AR,
      exportBaseName: exportBaseName,
      exportScopeSlug: exportScopeSlug,
      scopeLabelAr: scopeLabelAr,
      // The production API surface itself, from Code.gs — same names, same
      // signatures, same validation. The demo calls exactly what the web app calls.
      apiBootstrap: apiBootstrap,
      apiSlots: apiSlots,
      apiSubmit: apiSubmit,
      apiStaffBoard: apiStaffBoard,
      apiStaffStatus: apiStaffStatus,
      apiStaffReschedule: apiStaffReschedule,
      apiStaffBlock: apiStaffBlock,
      apiStaffLookup: apiStaffLookup,
      apiStaffSlots: apiStaffSlots,
      apiStaffCatalog: apiStaffCatalog,
      apiStaffWaMark: apiStaffWaMark,
      apiStaffKpis: apiStaffKpis
    };
  })();

  /* ------------------------------------------------------------------ *
   * Persistence of the fake world
   * ------------------------------------------------------------------ */

  function serialize() {
    var plain = {};
    Object.keys(sheets).forEach(function (name) {
      var sh = sheets[name];
      var rows = [];
      for (var r = 0; r < sh.grid.length; r++) rows.push(sh.grid[r].slice());
      plain[name] = rows;
    });
    return {
      mockNow: mockNow,
      savedAt: RealDate.now(),
      sheets: plain,
      events: events.map(function (e) {
        return {
          id: e.id, title: e.title, color: e.color, description: e.description, location: e.location,
          start: new RealDate(e.start.getTime()).toISOString(),
          end: new RealDate(e.end.getTime()).toISOString()
        };
      })
    };
  }

  function save() { writeRaw(STORE_KEY, JSON.stringify(serialize())); }

  function restore(saved) {
    Object.keys(saved.sheets).forEach(function (name) {
      sheets[name] = new FakeSheet(name, saved.sheets[name]);
    });
    events = (saved.events || []).map(function (e) {
      eventSeq++;
      return {
        id: e.id || 'evt-' + eventSeq,
        title: e.title, color: e.color, description: e.description, location: e.location,
        start: new RealDate(e.start),
        end: new RealDate(e.end)
      };
    });
    calendar = buildCalendar('demo');
  }

  function bootstrapDemo() {
    var mode = 'seeded';
    if (persisted && persisted.sheets && Object.keys(persisted.sheets).length) {
      restore(persisted);
      mode = 'restored';
    } else {
      SERVER.createAllSheets();
      SERVER.seedPlaceholders();
      SERVER.ensureSharedCalendar();
    }
    // Applied on both paths: a browser that kept yesterday's demo data must still get
    // today's demo data, or the presenter sees a half-configured board.
    applyDemoData();
    save();
    return mode;
  }

  /**
   * Demo data only — every line here is something the real clinic would set in its
   * own sheets. Nothing here changes a product rule.
   */
  function applyDemoData() {
    // The seeded reasons ask for 4–24 hours' notice, which would hide the pinned
    // "today" and leave the reception board empty on stage. Zeroing the notice keeps
    // the real engine and the real lead-time check intact.
    SERVER.Db.rows(SERVER.SHEET.REASONS).forEach(function (reason) {
      SERVER.Db.update(SERVER.SHEET.REASONS, 'reason_id', reason.reason_id, { lead_hours: 0 });
    });

    // Real-looking initials, because the placeholder names are Arabic brackets and
    // would both derive to "aa". Makes the confirmation read ae-20261018-1.
    SERVER.Db.update(SERVER.SHEET.DOCTORS, 'doctor_id', 'D1', { code: 'ae' });
    SERVER.Db.update(SERVER.SHEET.DOCTORS, 'doctor_id', 'D2', { code: 'ms' });

    // The placeholder clinic works Dr. 1 on Sun/Wed and Dr. 2 on Mon/Tue, so no single
    // day ever showed two doctors and the reception's per-doctor filter had nothing to
    // filter. A Sunday afternoon window for Dr. 2 gives the shared schedule two columns.
    var hasA8 = SERVER.Db.rows(SERVER.SHEET.AVAILABILITY).some(function (a) {
      return String(a.availability_id || '').trim() === 'A8';
    });
    if (!hasA8) {
      SERVER.Db.append(SERVER.SHEET.AVAILABILITY, {
        availability_id: 'A8', doctor_id: 'D2', clinic_id: 'C1', reason_id: 'R2',
        weekday: 0, from_time: '14:00', to_time: '17:00', slot_min: 30,
        max_per_day_override: 8, valid_from: '', valid_to: '', active: 'TRUE'
      });
    }

    SERVER.setSetting(SERVER.SETTING.STAFF_CODE, STAFF_CODE);
    SERVER.setSetting(SERVER.SETTING.REPORT_EMAIL, 'demo@polyclinic.example');
    SERVER.setSetting(SERVER.SETTING.WHATSAPP_NUMBER, '+201000000000');
    SERVER.setSetting(SERVER.SETTING.SUPPORT_PHONE, '0220000000');
    SERVER.invalidateSettingsCache();
  }

  var bootMode = bootstrapDemo();

  /* ------------------------------------------------------------------ *
   * google.script.run shim
   * ------------------------------------------------------------------ */

  function makeRunner() {
    var onSuccess = function () {};
    var onFailure = function (err) { window.console && window.console.error(err); };

    var proxy = null;

    // Note: the handler functions must return the *proxy*, not the target, or the
    // chained call google.script.run.withSuccessHandler(cb).withFailureHandler(cb)[fn]
    // would fall through to an object with no server functions on it.
    var handler = {
      get: function (target, prop) {
        if (prop === 'withSuccessHandler') {
          return function (cb) { onSuccess = cb; return proxy; };
        }
        if (prop === 'withFailureHandler') {
          return function (cb) { onFailure = cb; return proxy; };
        }
        if (typeof prop !== 'string') return undefined;
        return function () {
          var args = Array.prototype.slice.call(arguments);
          setTimeout(function () {
            try {
              if (typeof SERVER[prop] !== 'function') throw new Error('لا توجد دالة باسم ' + prop);
              var result = SERVER[prop].apply(SERVER, args);
              save();
              onSuccess(result);
            } catch (err) {
              onFailure(err);
            }
          }, 120);
        };
      }
    };

    proxy = new Proxy({}, handler);
    return proxy;
  }

  // google.script.run must hand out a *fresh* chain per access, exactly like Apps
  // Script does. If the handlers were shared, two calls in flight at once (the
  // reception board loads bookings and the catalogue together) would overwrite each
  // other's callbacks and one promise would never settle.
  window.google = { script: {} };
  Object.defineProperty(window.google.script, 'run', {
    get: function () { return makeRunner(); },
    configurable: true
  });

  /* ------------------------------------------------------------------ *
   * Exports: the reception screen opens ?page=export; the demo turns that
   * into a real CSV download so the flow is visible without Drive.
   * ------------------------------------------------------------------ */

  window.POLYCLINIC_DEMO = {
    page: PAGE,
    bootMode: bootMode,
    staffCode: STAFF_CODE,
    storeKey: STORE_KEY,
    mockNow: mockNow,
    mockNowLabel: mockNowLabel,
    reset: function () { dropRaw(STORE_KEY); dropRaw('polyclinic_staff_code'); window.location.reload(); },
    events: function () { return events.map(function (e) { return e; }); },
    save: save
  };

  var realOpen = window.open;
  window.open = function (url, name, features) {
    if (typeof url === 'string' && url.indexOf('page=export') !== -1) {
      demoDownload(url);
      return null;
    }
    return realOpen.call(window, url, name, features);
  };

  function demoDownload(url) {
    var query = url.split('?')[1] || '';
    var params = {};
    query.split('&').forEach(function (pair) {
      var p = pair.split('=');
      params[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
    });
    var filters = {
      from: params.from, to: params.to,
      doctorId: params.doctor, clinicId: params.clinic,
      reasonId: params.reason, status: params.status
    };
    var base = SERVER.exportBaseName(filters);
    var scope = SERVER.scopeLabelAr(filters);

    // The real thing: a genuine .xlsx built in the browser. Live, Drive converts a
    // temporary Sheet; offline there is no Drive, so tools/xlsx-writer.js writes the
    // same five OOXML parts Excel expects. Same name, same columns, same filter.
    if (params.type !== 'csv' && window.POLYCLINIC_XLSX) {
      var rows = [SERVER.REPORT_HEADER_AR].concat(SERVER.reportRows(filters));
      saveBlobFile(
        new Blob([window.POLYCLINIC_XLSX.build(rows, 'Bookings')],
          { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
        base + '.xlsx'
      );
      demoToast('تم إنشاء ملف Excel — ' + (rows.length - 1) + ' حجز (' + scope + ')');
      return;
    }

    saveBlobFile(new Blob([SERVER.exportCsv(filters)], { type: 'text/csv;charset=utf-8;' }), base + '.csv');
    demoToast('تم إنشاء ملف CSV — ' + scope);
  }

  function saveBlobFile(blob, fileName) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function demoToast(message) {
    var t = document.getElementById('toast');
    if (t) { t.textContent = message; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 4000); }
    else window.console.log(message);
  }

  function refreshCalendarHint() { /* index.html reads storage directly */ }

  /* ------------------------------------------------------------------ *
   * The demo strip, so nobody mistakes this for the live system
   * ------------------------------------------------------------------ */

  function injectStrip() {
    var style = document.createElement('style');
    style.textContent =
      '#demo-strip{position:fixed;bottom:0;right:0;left:0;background:#101828;color:#fff;font:13px/1.6 "Segoe UI",Tahoma,Arial;' +
      'padding:7px 14px;z-index:99;display:flex;gap:14px;align-items:center;justify-content:space-between;direction:rtl}' +
      '#demo-strip b{color:#7dd3c0}' +
      '#demo-strip button{background:#7dd3c0;border:0;border-radius:7px;padding:4px 10px;font:inherit;cursor:pointer;color:#04312b}' +
      '#demo-strip .d{margin-left:auto}' +
      'body{padding-bottom:46px}';
    document.head.appendChild(style);

    var strip = document.createElement('div');
    strip.id = 'demo-strip';
    strip.innerHTML =
      '<span>عرض تجريبي — البيانات وهمية. ساعة العرض: <b>' + mockNowLabel() + '</b></span>' +
      (PAGE === 'reception' ? '<span>كود الاستقبال: <b>' + STAFF_CODE + '</b></span>' : '') +
      '<span class="d"><button onclick="window.POLYCLINIC_DEMO.reset()">إعادة تعيين البيانات</button></span>';
    document.body.appendChild(strip);
  }

  /* ------------------------------------------------------------------ *
   * Reception: skip the code gate, this is a demo
   * ------------------------------------------------------------------ */

  if (PAGE === 'reception') {
    if (!readRaw('polyclinic_staff_code')) writeRaw('polyclinic_staff_code', STAFF_CODE);
  }

  if (document.body) injectStrip();
  else document.addEventListener('DOMContentLoaded', injectStrip);

  // Let the launcher know the world is ready.
  writeRaw('polyclinic_demo_ready', String(RealDate.now()));
})();

</script>
